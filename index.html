<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<title>CarvoX Garage Manager</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout: single-column phone app, glass cards on a dim garage backdrop, floating 7-tab bar, bottom sheets for every form.
   Palette tokens: bg (ground), panel (glass), line, fg/mut (text), acc/accfg (white pill buttons), semantic good/warn/bad. */
:root{
  --bg:#08090b; --fg:#f2f3f5; --mut:#9ba1aa; --panel:rgba(255,255,255,.065); --panel2:rgba(255,255,255,.1);
  --line:rgba(255,255,255,.13); --field:rgba(0,0,0,.38); --acc:#f1f2f4; --accfg:#101114;
  --good:#56d98a; --warn:#f2c14e; --bad:#ff7a70; --sheet:#1b1c1f; --shadow:0 10px 30px rgba(0,0,0,.45);
  --pp-good:#1a8a4a; --pp-bad:#c8372d; --pp-warn:#b57a05;
  --pp-bg:#ffffff; --pp-fg:#15171a; --pp-mut:#6a707a; --pp-line:#dfe2e6; --pp-acc:#15171a;
  --fs:15px; --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --f-disp:'Sora','Manrope',system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-app="blue"]{--bg:#050a18;--panel:rgba(48,92,200,.16);--panel2:rgba(70,120,230,.26);--line:rgba(120,160,255,.25);--field:rgba(2,8,28,.55);--acc:#4a86ff;--accfg:#fff;--sheet:#0e1730;}
:root[data-app="midnight"]{--bg:#0b0f14;--panel:rgba(255,255,255,.05);--panel2:rgba(255,255,255,.09);--line:rgba(120,230,220,.18);--field:rgba(0,0,0,.4);--acc:#5ad8cb;--accfg:#06201d;--sheet:#131a21;}
:root[data-app="light"]{--bg:#eef0f3;--fg:#15171a;--mut:#5f6670;--panel:#ffffff;--panel2:#e7eaee;--line:rgba(0,0,0,.12);--field:#f3f5f7;--acc:#15171a;--accfg:#ffffff;--good:#1c8f4e;--warn:#a87405;--bad:#c63a2f;--sheet:#ffffff;--shadow:0 10px 30px rgba(0,0,0,.14);color-scheme:light;}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:var(--fs);line-height:1.4;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;background-size:cover;background-position:center}
#bg.garage{background:radial-gradient(120% 55% at 50% -8%,rgba(255,255,255,.16),transparent 62%),repeating-linear-gradient(115deg,rgba(255,255,255,.04) 0 2px,transparent 2px 28px),linear-gradient(#16181c,#050506)}
#bg.blue{background:radial-gradient(100% 50% at 80% 0,rgba(60,120,255,.4),transparent 60%),linear-gradient(#0a1f55,#040816)}
#bg.black{background:#000}
:root[data-app="light"] #bg.garage,:root[data-app="light"] #bg.black{filter:invert(1) hue-rotate(180deg);}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:14px 130px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.logo{width:3.6em;height:3.6em;border-radius:1.1em;border:1px solid var(--line);background:linear-gradient(145deg,var(--panel2),var(--panel));display:grid;place-items:center;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:cover}
.logo svg{width:60%;height:60%}
.brand{flex:1;min-width:0}
.brand b{display:block;font:700 1.55em var(--f-disp);letter-spacing:.01em}
.brand span{color:var(--mut);font-size:.95em}
.icon-btn{width:3em;height:3em;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;flex:none}
.icon-btn svg{width:1.35em;height:1.35em}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--panel);border:1px solid var(--line);border-radius:28px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.welcome{padding:22px 24px;display:flex;align-items:center;gap:14px;margin-bottom:26px}
.welcome .t{flex:1;min-width:0}
.eyebrow{font-size:.78em;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);font-weight:700}
.welcome h2{margin:6px 0 4px;font:700 2em var(--f-disp);letter-spacing:-.02em}
.welcome p{margin:0;color:var(--mut)}
.welcome .gname{color:var(--fg);font-weight:600}
.ring{width:4.6em;height:4.6em;border-radius:50%;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;flex:none}
.ring svg{width:50%;height:50%}
.sec{margin:26px 0 12px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qa button{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);text-align:left;font-weight:600;min-width:0}
.qa .ic{width:2.5em;height:2.5em;border-radius:.9em;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.qa .ic svg{width:55%;height:55%}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tiles.t3{grid-template-columns:repeat(3,1fr)}
.tile{padding:16px 18px;border-radius:26px;border:1px solid var(--line);background:var(--panel);min-width:0;text-align:left}
.tile small{display:block;color:var(--mut)}
.tile .num{display:block;font:700 1.6em var(--f-disp);margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.t3 .tile{padding:14px 14px}
.t3 .tile .num{font-size:1.45em}
button.tile{color:var(--fg)}
.tile.wide{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;text-align:center}
.tile.row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.tile.row .num{margin:0}
.tile.row small{display:inline}
.tile .hint{color:var(--mut);font-size:.85em}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 18px}
.pagehead h1{margin:0;font:700 1.6em var(--f-disp);letter-spacing:-.02em}
.btn{border:0;border-radius:999px;padding:.8em 1.3em;background:var(--acc);color:var(--accfg);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:.5em;white-space:nowrap}
.btn svg{width:1.2em;height:1.2em}
.btn.ghost{background:var(--panel);color:var(--fg);border:1px solid var(--line);font-weight:600}
.btn.sm{padding:.55em 1em;font-size:.92em}
.btn.block{width:100%}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.search{width:100%;margin:14px 0;padding:.9em 1.1em;border-radius:999px;border:1px solid var(--line);background:var(--field)}
.empty{border:1px dashed var(--line);border-radius:24px;padding:26px 16px;text-align:center;color:var(--mut)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:22px;border:1px solid var(--line);background:var(--panel);text-align:left;width:100%;color:var(--fg)}
.item .l{flex:1;min-width:0}
.item .l b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .l small{display:block;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .r{text-align:right;flex:none}
.item .r b{display:block;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:.15em .7em;border-radius:999px;font-size:.8em;font-weight:700;border:1px solid currentColor}
.pill.good{color:var(--good)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}.pill.mut{color:var(--mut)}
.mini{background:transparent;border:1px solid var(--line);border-radius:999px;color:var(--mut);padding:.35em .8em;font-size:.85em;flex:none}
.mini.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:.6em 1.1em;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:600}
.chip.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.subhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:28px 0 12px}
.subhead h3{margin:0;font:700 1.1em var(--f-disp)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 max(10px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex;gap:2px;padding:6px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
nav.tabs button{flex:1;min-width:0;border:0;background:transparent;border-radius:999px;padding:.55em 0 .45em;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68em;font-weight:600}
nav.tabs button svg{width:2.2em;height:2.2em}
nav.tabs button.on{background:var(--panel2);color:var(--fg)}
#sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sh-panel{width:100%;max-width:560px;max-height:94%;overflow:auto;background:var(--sheet);border:1px solid var(--line);border-bottom:0;border-radius:30px 30px 0 0;padding:10px max(20px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-right,0px))}
.grab{width:3.6em;height:.35em;border-radius:99px;background:var(--line);margin:4px auto 14px}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sh-head h2{margin:0;font:700 1.45em var(--f-disp);letter-spacing:-.02em}
label.f{display:block;margin:14px 0 6px;color:var(--mut);font-size:.95em}
.sh-body input:not([type=checkbox]):not([type=range]):not([type=file]),.sh-body select,.sh-body textarea,.set input:not([type=range]):not([type=file]){width:100%;padding:.85em 1.1em;border-radius:999px;border:1px solid var(--line);background:var(--field);min-width:0}
.sh-body textarea{border-radius:22px;min-height:5.5em;resize:vertical}
.sh-body input[type=file],.set input[type=file]{width:100%;padding:.7em 1em;border-radius:22px;border:1px solid var(--line);background:var(--field)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{display:flex;align-items:center;gap:10px;padding:.9em 1em;border-radius:20px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:.88em;letter-spacing:.02em;color:var(--mut);cursor:pointer}
.cat input{width:1.4em;height:1.4em;accent-color:var(--acc);flex:none}
.cat:has(input:checked){background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.blk{font-size:.78em;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);font-weight:700;margin:24px 0 10px}
.li{display:flex;align-items:center;gap:10px;padding:.55em .9em;border-radius:16px;background:var(--panel);border:1px solid var(--line);margin-top:8px}
.li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.li .x{border:0;background:transparent;color:var(--mut);display:grid;place-items:center;padding:2px}
.li .x svg{width:1.1em;height:1.1em}
.hint{color:var(--mut);font-size:.9em;margin:8px 0}
.actions{display:flex;gap:12px;margin-top:24px}
.actions .btn{flex:1}
.duebox{padding:.85em 1.1em;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-variant-numeric:tabular-nums}
.paper{background:var(--pp-bg);color:var(--pp-fg);border-radius:18px;padding:22px 20px;font-size:.93em}
.paper .ph{display:flex;gap:12px;align-items:center;border-bottom:2px solid var(--pp-acc);padding-bottom:14px}
.paper .pl{width:3.2em;height:3.2em;border-radius:12px;border:1px solid var(--pp-line);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--pp-fg)}
.paper .pl img{width:100%;height:100%;object-fit:cover}
.paper .pl svg{width:60%;height:60%}
.paper .gn{flex:1;min-width:0}
.paper .gn b{font:700 1.2em var(--f-disp);display:block}
.paper .gn small{color:var(--pp-mut);display:block}
.paper .inv{text-align:right;flex:none}
.paper .inv b{font:700 .8em var(--f-body);letter-spacing:.22em;color:var(--pp-mut);display:block}
.paper .inv span{font:700 1.15em var(--f-disp);display:block}
.paper .meta{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}
.paper .meta small{display:block;color:var(--pp-mut);font-size:.78em;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.paper .meta div{min-width:0;overflow-wrap:anywhere}
.paper .svc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.paper .svc span{border:1px solid var(--pp-fg);border-radius:99px;padding:.1em .7em;font-size:.78em;font-weight:700;letter-spacing:.05em}
.paper table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.paper th{font-size:.72em;letter-spacing:.14em;text-transform:uppercase;color:var(--pp-mut);text-align:right;padding:6px 0;border-bottom:1px solid var(--pp-line)}
.paper th:first-child,.paper td:first-child{text-align:left}
.paper td{padding:8px 0;border-bottom:1px solid var(--pp-line);text-align:right;vertical-align:top}
.paper td:first-child{padding-right:8px;overflow-wrap:anywhere}
.paper .sumrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 12px;margin-top:14px}
.paper .tot{margin:0;flex:1;max-width:15em;min-width:11em;margin-left:auto}
.stamp{flex:none;transform:rotate(-12deg);border:3px solid currentColor;border-radius:10px;padding:.12em .55em .1em;font:800 1.35em var(--f-disp);letter-spacing:.12em;text-transform:uppercase;opacity:.9;box-shadow:inset 0 0 0 2px var(--pp-bg),inset 0 0 0 3.5px currentColor;margin-left:6px}
.stamp.good{color:var(--pp-good)}.stamp.bad{color:var(--pp-bad)}.stamp.warn{color:var(--pp-warn)}
.paper .tot div{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums}
.paper .tot .g{font:700 1.15em var(--f-disp);border-top:2px solid var(--pp-acc);margin-top:4px;padding-top:8px}
.paper .tot .d{font-weight:800}
.paper .foot{margin-top:18px;text-align:center;color:var(--pp-mut);font-size:.85em}
.scroll-x{overflow-x:auto}
#toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--sheet);border:1px solid var(--line);color:var(--fg);padding:.7em 1.4em;border-radius:999px;box-shadow:var(--shadow);font-weight:600;max-width:90%;text-align:center}
#lockscr{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-items:center;padding:24px}
#lockscr .box{width:100%;max-width:340px;text-align:center;display:flex;flex-direction:column;gap:14px}
#lockscr input{width:100%;padding:.9em 1.1em;border-radius:999px;border:1px solid var(--line);background:var(--field);text-align:center;letter-spacing:.4em;font-size:1.2em}
.set{padding:22px 20px;margin-bottom:16px}
.set .eyebrow{margin-bottom:10px}
.set p{color:var(--mut);margin:0 0 12px}
.set .btn{margin-top:14px}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.btns2 .btn{margin:0}
input[type=range]{width:100%;accent-color:var(--acc)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.cal .h{text-align:center;color:var(--mut);font-size:.78em;font-weight:700}
.cal button,.cal i{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.85em;line-height:1.1;padding:0;font-style:normal}
.cal i{border:0;background:transparent}
.cal button b{font-size:.8em}
.cal .P{color:var(--good);border-color:var(--good)}.cal .A{color:var(--bad);border-color:var(--bad)}.cal .H{color:var(--warn);border-color:var(--warn)}.cal .L{color:#7fb2ff;border-color:#7fb2ff}
.cal button.on{box-shadow:inset 0 0 0 1px currentColor}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:.85em;color:var(--mut)}
.bar{height:.9em;border-radius:99px;background:var(--panel2);overflow:hidden;display:flex;margin:14px 0 8px}
.bar i{display:block;height:100%}
.chart text{fill:var(--mut);font-family:var(--f-body)}
.chart .v{fill:var(--fg);font-weight:700}
@media print{
  body.printing #app,body.printing nav.tabs,body.printing #bg,body.printing #toast{display:none!important}
  body.printing{background:#fff!important}
  body.printing #sheet{position:static;background:#fff;display:block}
  body.printing .sh-panel{max-height:none;overflow:visible;background:#fff;border:0;padding:0}
  body.printing .grab,body.printing .sh-head,body.printing .noprint{display:none!important}
}
@media (prefers-reduced-motion:no-preference){.sh-panel{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}}

html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#08090b}
body{margin:0}
</style>
</head>
<body>


<div id="bg" class="garage"></div>
<div id="app">
  <header class="top">
    <div class="logo" id="hlogo"></div>
    <div class="brand"><b>CarvoX</b><span>Smart Garage Manager</span></div>
    <button class="icon-btn" data-act="info" aria-label="What's new"></button>
    <button class="icon-btn" data-act="tab" data-tab="settings" aria-label="Settings"></button>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>
<div id="lockscr" hidden></div>
<input id="p_imp" type="file" hidden>

function ic(n){return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="'+P[n]+'"/></svg>';}
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var num=function(v){var n=parseFloat(v);return isFinite(n)?n:0};
var inr=function(n){n=num(n);return (n<0?'-':'')+'₹'+Math.abs(n).toLocaleString('en-IN',{maximumFractionDigits:2})};
var pad=function(n,l){return String(n).padStart(l,'0')};
var iso=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2)};
var today=function(){return iso(new Date())};
var fd=function(s){if(!s)return '';var a=s.split('-');return a[2]+'/'+a[1]+'/'+a[0]};
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DAYN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function dayLong(s){var a=s.split('-').map(Number);var d=new Date(a[0],a[1]-1,a[2]);return DAYN[d.getDay()]+', '+pad(a[2],2)+' '+MON[a[1]-1]+' '+a[0]}
function monthName(m){var a=m.split('-');return ['January','February','March','April','May','June','July','August','September','October','November','December'][+a[1]-1]+' '+a[0]}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function addDays(s,n){var a=s.split('-').map(Number);var d=new Date(a[0],a[1]-1,a[2]+n);return iso(d)}

var KEY='carvox_data_v1';
function def(){return {profile:{name:'',phone:'',address:'',logo:''},ui:{theme:'frosted',size:'default',bg:'garage',vis:88},bgimg:'',pin:'',seq:1,customers:[],bills:[],stock:[],suppliers:[],purchases:[],expenses:[],staff:[],attendance:[],salaries:[]}}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);return Object.assign(def(),o)}}catch(e){}return def()}
var S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save on this device')}}

/* ---------- derived ---------- */
var received=function(b){return b.payments.reduce(function(s,p){return s+p.amount},0)};
var dueOf=function(b){return b.due!=null?Math.max(0,b.due):Math.max(0,b.total-received(b))};
function earn(d){var t=0;S.bills.forEach(function(b){b.payments.forEach(function(p){if(p.date===d)t+=p.amount})});return t}
function exps(d){return S.expenses.filter(function(e){return e.date===d}).reduce(function(s,e){return s+e.amount},0)}
function prof(d){return S.bills.filter(function(b){return b.date===d}).reduce(function(s,b){return s+b.profit},0)}
function cnt(d){return S.bills.filter(function(b){return b.date===d}).length}
function dues(d){return S.bills.filter(function(b){return b.date===d}).reduce(function(s,b){return s+dueOf(b)},0)}
function allDues(){return S.bills.reduce(function(s,b){return s+dueOf(b)},0)}
function monthStats(m){var e=0,p=0,n=0,x=0;S.bills.forEach(function(b){if(b.date.slice(0,7)===m){n++;p+=b.profit}b.payments.forEach(function(pm){if(pm.date.slice(0,7)===m)e+=pm.amount})});S.expenses.forEach(function(ex){if(ex.date.slice(0,7)===m)x+=ex.amount});return {earn:e,profit:p,exp:x,net:e-x,bills:n}}
function getAtt(sid,d){return S.attendance.find(function(a){return a.staffId===sid&&a.date===d})}
function setAtt(sid,d,st){var r=getAtt(sid,d);if(!st){if(r)S.attendance=S.attendance.filter(function(a){return a!==r});return}if(r)r.status=st;else S.attendance.push({id:uid(),staffId:sid,date:d,status:st})}
function stName(id){var s=S.staff.find(function(x){return x.id===id});return s?s.name:'Removed staff'}

function openSheet(title,html,after){
  var sh=$('#sheet');
  sh.innerHTML='<div class="sh-panel" role="dialog" aria-label="'+esc(title)+'"><div class="grab"></div><div class="sh-head"><h2>'+esc(title)+'</h2><button class="icon-btn" data-act="closeSheet" aria-label="Close">'+ic('x')+'</button></div><div class="sh-body">'+html+'</div></div>';
  sh.hidden=false;document.body.classList.add('lock');
  if(after)after(sh);
}
function closeSheet(){var sh=$('#sheet');sh.hidden=true;sh.innerHTML='';document.body.classList.remove('lock','printing')}
function copyText(t){
  var done=function(){toast('Copied')};
  var fb=function(){openSheet('Copy text','<textarea id="ct" readonly rows="10"></textarea><p class="hint">Select all and copy.</p>',function(sh){var a=$('#ct',sh);a.value=t;a.focus();a.select()})};
  try{navigator.clipboard.writeText(t).then(done,fb)}catch(e){fb()}
}
function arm(btn,fn){
  if(btn.dataset.armed){fn();return}
  btn.dataset.armed='1';btn.classList.add('armed');btn.dataset.old=btn.innerHTML;btn.textContent='Tap again to delete';
  setTimeout(function(){if(btn.isConnected){delete btn.dataset.armed;btn.classList.remove('armed');btn.innerHTML=btn.dataset.old}},3000);
}
function readImage(file,max,type,cb){
  var fr=new FileReader();
  fr.onload=function(){var im=new Image();im.onload=function(){var r=Math.min(1,max/Math.max(im.width,im.height));var c=document.createElement('canvas');c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL(type,.82))};im.onerror=function(){toast('Could not read that image')};im.src=fr.result};
  fr.readAsDataURL(file);
}

var SIZES={small:13,default:15,large:17,xl:19};
function applyUI(){
  var u=S.ui;document.documentElement.dataset.app=u.theme==='frosted'?'':u.theme;
  if(u.theme==='frosted')document.documentElement.removeAttribute('data-app');
  document.body.style.setProperty('--fs',(SIZES[u.size]||15)+'px');
  document.body.style.fontSize=(SIZES[u.size]||15)+'px';
  var bg=$('#bg');bg.className=u.bg==='mine'?'':u.bg;bg.style.opacity=u.vis/100;
  bg.style.backgroundImage=u.bg==='mine'&&S.bgimg?'url('+S.bgimg+')':'';
  var hl=$('#hlogo');hl.innerHTML=S.profile.logo?'<img alt="" src="'+S.profile.logo+'">':carSvg();
  $('[data-act=info]').innerHTML=ic('info');$('[data-tab=settings]').innerHTML=ic('sun');
}

var TABS=[['home','Home','home'],['stock','Stock','box'],['bills','Bills','bill'],['customers','Customers','users'],['staff','Staff','badge'],['expenses','Expenses','wallet'],['reports','Reports','chart']];
function buildNav(){$('#tabs').innerHTML=TABS.map(function(t){return '<button data-act="tab" data-tab="'+t[0]+'">'+ic(t[2])+'<span>'+t[1]+'</span></button>'}).join('')}
function go(t){cur=t;render();window.scrollTo(0,0)}
function render(){
  var map={home:vHome,stock:vStock,bills:vBills,customers:vCust,staff:vStaff,expenses:vExp,reports:vRep,settings:vSet};
  $('#view').innerHTML=map[cur]();
  document.querySelectorAll('#tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.tab===cur)});
}

  openSheet(id?'Edit stock item':'Add stock item',F('Part name','<input id="s_name" value="'+esc(s.name)+'">')+F('Part number (optional)','<input id="s_pno" value="'+esc(s.pno)+'">')+'<div class="two"><div>'+F('Quantity','<input id="s_qty" type="number" inputmode="decimal" min="0" value="'+(s.qty!=null?s.qty:'')+'">')+'</div><div>'+F('Low stock alert at','<input id="s_low" type="number" inputmode="decimal" min="0" value="'+(s.low!=null?s.low:2)+'">')+'</div></div><div class="two"><div>'+F('Buying price (₹)','<input id="s_cost" type="number" inputmode="decimal" min="0" value="'+(s.cost!=null?s.cost:'')+'">')+'</div><div>'+F('Selling price (₹)','<input id="s_price" type="number" inputmode="decimal" min="0" value="'+(s.price!=null?s.price:'')+'">')+'</div></div><div class="actions"><button class="btn ghost" data-act="closeSheet">Cancel</button><button class="btn" id="s_save">Save</button></div>'+(id?'<button class="btn danger block" style="margin-top:12px" data-act="del" data-kind="stock" data-id="'+id+'">Delete item</button>':''),function(){
    $('#s_save').onclick=function(){
      var n=$('#s_name').value.trim();if(!n){toast('Enter the part name');return}
      var o=s.id?s:{id:uid(),createdAt:Date.now()};
      o.name=n;o.pno=$('#s_pno').value.trim();o.qty=num($('#s_qty').value);o.low=num($('#s_low').value);o.cost=num($('#s_cost').value);o.price=num($('#s_price').value);
      if(!s.id)S.stock.push(o);save();closeSheet();render();toast('Stock saved');
    };
  });
}

function purchaseSheet(){
  if(!S.stock.length){toast('Add a stock item first');return}
  openSheet('Record purchase',F('Supplier','<select id="pu_sup"><option value="">Not set</option>'+S.suppliers.map(function(s){return '<option>'+esc(s.name)+'</option>'}).join('')+'</select>')+F('Item','<select id="pu_item">'+S.stock.map(function(s){return '<option value="'+s.id+'">'+esc(s.name)+'</option>'}).join('')+'</select>')+'<div class="two"><div>'+F('Quantity','<input id="pu_qty" type="number" inputmode="decimal" value="1" min="0">')+'</div><div>'+F('Cost per piece (₹)','<input id="pu_cost" type="number" inputmode="decimal" min="0">')+'</div></div>'+F('Date','<input id="pu_date" type="date" value="'+today()+'">')+'<p class="hint">Stock quantity goes up and the buying price updates to this cost.</p><div class="actions"><button class="btn ghost" data-act="closeSheet">Cancel</button><button class="btn" id="pu_save">Save</button></div>',function(){

      save();closeSheet();render();toast('Purchase recorded');

  });

function staffSheet(editId){
  var old=editId?S.staff.find(function(x){return x.id===editId}):null;
  if(editId&&!old){toast('Staff not found');return}
  openSheet(old?'Edit staff':'Add staff',F('Name','<input id="t_name">')+'<div class="two"><div>'+F('Role','<input id="t_role" placeholder="Mechanic, Painter…">')+'</div><div>'+F('Phone','<input id="t_phone" inputmode="tel">')+'</div></div>'+F('Monthly salary (₹)','<input id="t_sal" type="number" inputmode="decimal" min="0">')+'<div class="actions"><button class="btn ghost" data-act="closeSheet">Cancel</button><button class="btn" id="t_save">Save</button></div>',function(){

    $('#t_save').onclick=function(){
      var n=$('#t_name').value.trim();if(!n){toast('Enter the name');return}
      var data={name:n,role:$('#t_role').value.trim(),phone:$('#t_phone').value.trim(),salary:num($('#t_sal').value)};
      if(old)Object.assign(old,data);else S.staff.push(Object.assign({id:uid()},data));
      save();closeSheet();render();toast(old?'Staff updated':'Staff added')
    };

function deleteStaff(id){
  var staff=S.staff.find(function(x){return x.id===id});if(!staff)return;
  if(!confirm('Delete '+staff.name+'? Attendance and salary records linked to this staff member will also be removed.'))return;
  var salaryIds=S.salaries.filter(function(x){return x.staffId===id}).map(function(x){return x.id});
  S.staff=S.staff.filter(function(x){return x.id!==id});
  S.attendance=S.attendance.filter(function(x){return x.staffId!==id});
  S.salaries=S.salaries.filter(function(x){return x.staffId!==id});
  S.expenses=S.expenses.filter(function(x){return !salaryIds.includes(x.salaryId)});
  save();render();toast('Staff deleted');
}
function attSheet(){
  if(!S.staff.length){toast('Add staff first');return}
  var st='Present';
  openSheet('Mark attendance',F('Staff','<select id="a_staff">'+S.staff.map(function(s){return '<option value="'+s.id+'">'+esc(s.name)+'</option>'}).join('')+'</select>')+F('Date','<input id="a_date" type="date" value="'+today()+'">')+'<label class="f">Status</label><div class="chips" id="a_st">'+['Present','Absent','Half day','Leave'].map(function(x){return '<button type="button" class="chip'+(x===st?' on':'')+'" data-s="'+x+'">'+x+'</button>'}).join('')+'</div><div class="actions"><button class="btn ghost" id="a_all">All present</button><button class="btn" id="a_save">Save</button></div>',function(sh){
    $('#a_st',sh).onclick=function(e){var b=e.target.closest('[data-s]');if(!b)return;st=b.dataset.s;sh.querySelectorAll('#a_st .chip').forEach(function(c){c.classList.toggle('on',c===b)})};
    $('#a_save').onclick=function(){setAtt($('#a_staff').value,$('#a_date').value||today(),st);save();closeSheet();render();toast('Attendance saved')};
    $('#a_all').onclick=function(){var d=$('#a_date').value||today();S.staff.forEach(function(s){if(!getAtt(s.id,d))setAtt(s.id,d,'Present')});save();closeSheet();render();toast('Marked everyone present')};
  });
}
var NEXT={'':'Present',Present:'Absent',Absent:'Half day','Half day':'Leave',Leave:''};
var LET={Present:'P',Absent:'A','Half day':'H',Leave:'L'};
function calSheet(sid){
  if(!S.staff.length){toast('Add staff first');return}
  sid=sid||S.staff[0].id;
  openSheet('Staff & calendar',F('Staff','<select id="k_staff">'+S.staff.map(function(s){return '<option value="'+s.id+'"'+(s.id===sid?' selected':'')+'>'+esc(s.name)+'</option>'}).join('')+'</select>')+F('Month','<input id="k_m" type="month" value="'+today().slice(0,7)+'">')+'<div class="cal" id="k_grid"></div><div class="legend" id="k_sum"></div><p class="hint">Tap a day to cycle Present, Absent, Half day, Leave and blank.</p>',function(sh){
    var draw=function(){
      var id=$('#k_staff').value,m=$('#k_m').value||today().slice(0,7),a=m.split('-').map(Number),first=new Date(a[0],a[1]-1,1).getDay(),n=new Date(a[0],a[1],0).getDate(),h='',c={Present:0,Absent:0,'Half day':0,Leave:0};
      ['S','M','T','W','T','F','S'].forEach(function(d){h+='<span class="h">'+d+'</span>'});
      for(var i=0;i<first;i++)h+='<i></i>';
      for(var d=1;d<=n;d++){var ds=m+'-'+pad(d,2),r=getAtt(id,ds);if(r)c[r.status]++;h+='<button type="button" data-d="'+ds+'" class="'+(r?LET[r.status]:'')+'">'+d+(r?'<b>'+LET[r.status]+'</b>':'')+'</button>'}
      $('#k_grid').innerHTML=h;
      $('#k_sum').innerHTML='<span>Present '+c.Present+'</span><span>Absent '+c.Absent+'</span><span>Half day '+c['Half day']+'</span><span>Leave '+c.Leave+'</span>';
    };
    draw();$('#k_staff').onchange=draw;$('#k_m').onchange=draw;
    $('#k_grid').onclick=function(e){var b=e.target.closest('[data-d]');if(!b)return;var id=$('#k_staff').value,r=getAtt(id,b.dataset.d);setAtt(id,b.dataset.d,NEXT[r?r.status:'']);save();draw();render()};
  });
}
function salarySheet(){
  if(!S.staff.length){toast('Add staff first');return}
  openSheet('Pay salary',F('Staff','<select id="y_staff">'+S.staff.map(function(s){return '<option value="'+s.id+'">'+esc(s.name)+'</option>'}).join('')+'</select>')+'<div class="two"><div>'+F('Month','<input id="y_m" type="month" value="'+today().slice(0,7)+'">')+'</div><div>'+F('Amount (₹)','<input id="y_amt" type="number" inputmode="decimal" min="0">')+'</div></div>'+F('Payment mode','<select id="y_mode"><option>Cash</option><option>UPI</option><option>Bank transfer</option></select>')+'<p class="hint">The payment is also added to Expenses as Salary.</p><div class="actions"><button class="btn ghost" data-act="closeSheet">Cancel</button><button class="btn" id="y_save">Pay</button></div>',function(){
    var fill=function(){var s=S.staff.find(function(x){return x.id===$('#y_staff').value});$('#y_amt').value=s&&s.salary?s.salary:''};fill();$('#y_staff').onchange=fill;
    $('#y_save').onclick=function(){
      var s=S.staff.find(function(x){return x.id===$('#y_staff').value}),a=num($('#y_amt').value);if(!s||a<=0){toast('Enter the amount');return}

/* ----- bill form ----- */
var CATS=['ALIGNMENT','BALANCING','DENTING','PAINTING','REPAIRS','WASHING','ELECTRICAL WORK','AC WORK','INSURANCE','OTHER'];
function billSheet(custId,editId){
  var E=editId?S.bills.find(function(x){return x.id===editId}):null;
  var d={parts:E?JSON.parse(JSON.stringify(E.parts)):[],customs:E?JSON.parse(JSON.stringify(E.customs)):[],manual:false};
  if(E)custId=E.custId;
  var cu=E?{name:E.name,phone:E.phone,vehicle:E.vehicle,reg:E.reg}:(S.customers.find(function(x){return x.id===custId})||{});
  var oldQ=function(id){var t=0;if(E)E.parts.forEach(function(p){if(p.id===id)t+=p.qty});return t};
  var avail=function(s){return s.qty+oldQ(s.id)};
  var html=F('Saved customer','<select id="b_cust"><option value="">Pick a saved customer (optional)</option>'+S.customers.map(function(c){return '<option value="'+c.id+'"'+(c.id===custId?' selected':'')+'>'+esc(c.name)+(c.vehicle?' · '+esc(c.vehicle):'')+'</option>'}).join('')+'</select>')
  +'<div class="two"><div>'+F('Bill number','<input id="b_no" value="'+esc(E?E.no:'CX-'+pad(S.seq,4))+'">')+'</div><div>'+F('Date','<input id="b_date" type="date" value="'+(E?E.date:today())+'">')+'</div></div>'
  +F('Customer name','<input id="b_name" value="'+esc(cu.name)+'">')
  +'<div class="two"><div>'+F('Phone','<input id="b_phone" inputmode="tel" value="'+esc(cu.phone)+'">')+'</div><div>'+F('Vehicle','<input id="b_veh" value="'+esc(cu.vehicle)+'">')+'</div></div>'
  +F('Registration number','<input id="b_reg" value="'+esc(cu.reg)+'">')
  +'<label class="f">Service category (Select multiple)</label><div class="cats" id="b_cats">'+CATS.map(function(c){return '<label class="cat"><input type="checkbox" value="'+c+'"'+(E&&E.cats.indexOf(c)>-1?' checked':'')+'>'+c+'</label>'}).join('')+'</div>'
  +F('Service / labour details','<textarea id="b_det">'+esc(E?E.details:'')+'</textarea>')
  +F('Service / labour charge (₹)','<input id="b_lab" type="number" inputmode="decimal" min="0" value="'+(E?E.labour:0)+'">')
  +'<div class="blk">Stock parts used</div><div class="three"><select id="b_stock"><option value="">Choose item from stock</option>'+S.stock.filter(function(s){return avail(s)>0}).map(function(s){return '<option value="'+s.id+'">'+esc(s.name)+' ('+avail(s)+' left) · '+inr(s.price)+'</option>'}).join('')+'</select><input id="b_sq" type="number" inputmode="decimal" min="1" value="1" style="width:5em" aria-label="Quantity"><button type="button" class="btn sm" id="b_sadd">Add</button></div><p class="hint">Stock reduces automatically when the bill is saved.</p><div id="b_parts"></div>'
  +'<div class="blk">Custom items (not from stock)</div><div class="three" style="grid-template-columns:1fr 5.5em 4em"><input id="b_cn" placeholder="Item name" aria-label="Item name"><input id="b_cp" type="number" inputmode="decimal" min="0" placeholder="₹" aria-label="Price"><input id="b_cq" type="number" inputmode="decimal" min="1" value="1" aria-label="Quantity"></div><button type="button" class="btn ghost block" style="margin-top:10px" id="b_cadd">'+ic('plus')+'Add custom item</button><div id="b_customs"></div>'
  +'<div class="blk">Payment</div><div class="two"><div>'+F('Bill total (₹)','<input id="b_total" type="number" inputmode="decimal" min="0" value="'+(E?E.total.toFixed(2):'0.00')+'">')+'</div><div>'+F('Amount received (₹)','<input id="b_recv" type="number" inputmode="decimal" min="0" value="'+(E?received(E):0)+'">')+'</div></div>'
  +'<div class="two"><div>'+F('Payment mode','<select id="b_mode"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank transfer</option><option>Cheque</option></select>')+'</div><div>'+F('Due amount','<input id="b_due" type="number" inputmode="decimal" min="0" value="'+(E?dueOf(E):0)+'">')+'</div></div>'
  +'<div class="hint" id="b_note"></div><button type="button" class="mini" id="b_auto">Set due = total − received</button>'
  +'<label class="f">Profit (₹) — your own figure</label><div style="display:flex;gap:8px"><input id="b_prof" type="number" inputmode="decimal" value="'+(E?E.profit:0)+'" style="flex:1;min-width:0"><button type="button" class="btn ghost sm" id="b_est">Estimate</button></div><p class="hint">Estimate = labour charge + (selling − buying price) of stock parts. Custom item cost is unknown, so adjust if needed.</p>'
  +'<div class="actions"><button class="btn ghost" data-act="closeSheet">Cancel</button><button class="btn" id="b_save">'+(E?'Save changes':'Save bill')+'</button></div>';
  openSheet(E?'Edit bill':'New bill',html,function(sh){
    var g=function(i){return $('#'+i,sh)};
    var calc=function(){
      var lab=num(g('b_lab').value),ps=d.parts.reduce(function(s,p){return s+p.price*p.qty},0),cs=d.customs.reduce(function(s,p){return s+p.price*p.qty},0);
      if(!d.manual)g('b_total').value=(lab+ps+cs).toFixed(2);
      var tt=num(g('b_total').value),rr=num(g('b_recv').value),dd=num(g('b_due').value),df=tt-rr-dd;
      g('b_note').textContent=df>0.005?('Discount: '+inr(df)+' (total − received − due)'):(df<-0.005?'Received + due is more than the bill total.':'');
    };
    var draw=function(){
      g('b_parts').innerHTML=d.parts.map(function(p,i){return '<div class="li"><span>'+esc(p.name)+' × '+p.qty+'</span><b>'+inr(p.price*p.qty)+'</b><button type="button" class="x" data-rm="p'+i+'" aria-label="Remove">'+ic('x')+'</button></div>'}).join('')||'<p class="hint">No stock items added.</p>';
      g('b_customs').innerHTML=d.customs.map(function(p,i){return '<div class="li"><span>'+esc(p.name)+' × '+p.qty+'</span><b>'+inr(p.price*p.qty)+'</b><button type="button" class="x" data-rm="c'+i+'" aria-label="Remove">'+ic('x')+'</button></div>'}).join('')||'<p class="hint">No custom items added.</p>';
      calc();
    };
    if(E){var cs=E.labour+d.parts.reduce(function(s,p){return s+p.price*p.qty},0)+d.customs.reduce(function(s,p){return s+p.price*p.qty},0);d.manual=Math.abs(cs-E.total)>0.005;g('b_mode').value=E.mode}
    draw();
    g('b_cust').onchange=function(){var c=S.customers.find(function(x){return x.id===g('b_cust').value});if(c){g('b_name').value=c.name;g('b_phone').value=c.phone||'';g('b_veh').value=c.vehicle||'';g('b_reg').value=c.reg||''}};
    g('b_lab').oninput=calc;g('b_recv').oninput=calc;g('b_due').oninput=calc;

    g('b_total').oninput=function(){d.manual=true;calc()};
    g('b_sadd').onclick=function(){
      var s=S.stock.find(function(x){return x.id===g('b_stock').value}),n=num(g('b_sq').value);
      if(!s){toast('Choose a stock item');return}if(n<=0){toast('Enter a quantity');return}
      var ex=d.parts.find(function(p){return p.id===s.id}),have=ex?ex.qty:0;
      if(have+n>avail(s)){toast('Only '+avail(s)+' in stock');return}
      if(ex)ex.qty+=n;else d.parts.push({id:s.id,name:s.name,qty:n,price:s.price,cost:s.cost});
      g('b_stock').value='';g('b_sq').value=1;d.manual=false;draw();
    };
    g('b_cadd').onclick=function(){
      var n=g('b_cn').value.trim(),p=num(g('b_cp').value),qy=num(g('b_cq').value)||1;
      if(!n){toast('Enter the item name');return}
      d.customs.push({name:n,price:p,qty:qy});g('b_cn').value='';g('b_cp').value='';g('b_cq').value=1;d.manual=false;draw();
    };
    sh.addEventListener('click',function(e){var b=e.target.closest('[data-rm]');if(!b)return;var k=b.dataset.rm,i=+k.slice(1);(k[0]==='p'?d.parts:d.customs).splice(i,1);d.manual=false;draw()});
    g('b_est').onclick=function(){g('b_prof').value=(num(g('b_lab').value)+d.parts.reduce(function(s,p){return s+(p.price-p.cost)*p.qty},0)).toFixed(2)};
    g('b_save').onclick=function(){
      var name=g('b_name').value.trim();
      if(!name&&!g('b_veh').value.trim()){toast('Enter customer name or vehicle');return}
      var cats=[].slice.call(sh.querySelectorAll('#b_cats input:checked')).map(function(i){return i.value});
      var total=num(g('b_total').value),rc=num(g('b_recv').value),date=g('b_date').value||today(),due=Math.min(num(g('b_due').value),Math.max(0,total-rc));
      var cid=g('b_cust').value;
      if(!cid&&name){
        var phone=g('b_phone').value.trim(),m=S.customers.find(function(c){return c.name.toLowerCase()===name.toLowerCase()&&(c.phone||'')===phone});
        if(!m){m={id:uid(),name:name,phone:phone,vehicle:g('b_veh').value.trim(),reg:g('b_reg').value.trim().toUpperCase(),notes:'',createdAt:Date.now()};S.customers.push(m)}
        cid=m.id;
      }
      var b={id:uid(),no:g('b_no').value.trim()||('CX-'+pad(S.seq,4)),date:date,custId:cid,name:name,phone:g('b_phone').value.trim(),vehicle:g('b_veh').value.trim(),reg:g('b_reg').value.trim().toUpperCase(),cats:cats,details:g('b_det').value.trim(),labour:num(g('b_lab').value),parts:d.parts,customs:d.customs,total:total,due:due,mode:g('b_mode').value,payments:rc>0?[{date:date,amount:rc,mode:g('b_mode').value}]:[],profit:num(g('b_prof').value),createdAt:Date.now()};
      if(E){
        E.parts.forEach(function(p){var s=S.stock.find(function(x){return x.id===p.id});if(s)s.qty+=p.qty});
        var curRc=received(E),pm=g('b_mode').value;
        E.no=b.no;E.date=b.date;E.custId=b.custId;E.name=b.name;E.phone=b.phone;E.vehicle=b.vehicle;E.reg=b.reg;E.cats=b.cats;E.details=b.details;E.labour=b.labour;E.parts=b.parts;E.customs=b.customs;E.total=b.total;E.due=b.due;E.mode=b.mode;E.profit=b.profit;
        if(rc>curRc)E.payments.push({date:today(),amount:rc-curRc,mode:pm});
        else if(rc<curRc){var ex=curRc-rc;for(var i=E.payments.length-1;i>=0&&ex>0;i--){var pp=E.payments[i];if(pp.amount<=ex){ex-=pp.amount;E.payments.splice(i,1)}else{pp.amount-=ex;ex=0}}}
        E.parts.forEach(function(p){var s=S.stock.find(function(x){return x.id===p.id});if(s)s.qty=Math.max(0,s.qty-p.qty)});
        save();closeSheet();render();toast('Bill updated');billView(E.id);return;
      }
      d.parts.forEach(function(p){var s=S.stock.find(function(x){return x.id===p.id});if(s)s.qty=Math.max(0,s.qty-p.qty)});
      S.bills.push(b);S.seq++;save();closeSheet();go('bills');toast('Bill saved');billView(b.id);
    };
  });
}
function adjOf(b){return b.total-(b.labour+b.parts.concat(b.customs).reduce(function(s,p){return s+p.price*p.qty},0))}
function invoiceHtml(b){
  var p=S.profile,rows=[];
  if(b.labour>0||b.details)rows.push([b.details||'Service / labour',1,b.labour,b.labour,1]);
  b.parts.forEach(function(x){rows.push([x.name,x.qty,x.price,x.price*x.qty])});
  b.customs.forEach(function(x){rows.push([x.name,x.qty,x.price,x.price*x.qty])});
  var ad=adjOf(b);if(Math.abs(ad)>0.005)rows.push([ad<0?'Discount':'Adjustment',1,ad,ad]);
  var rc=received(b),du=dueOf(b),disc=Math.max(0,b.total-rc-du),stp=du<=0?['PAID','good']:(rc>0?['PARTIAL','warn']:['UNPAID','bad']);
  return '<div class="paper" id="invoice"><div class="ph"><div class="pl">'+(p.logo?'<img alt="" src="'+p.logo+'">':carSvg())+'</div><div class="gn"><b>'+esc(p.name||'CarvoX Garage')+'</b><small>'+esc([p.phone,p.address].filter(Boolean).join(' · ')||'Smart Garage Manager')+'</small></div><div class="inv"><b>INVOICE</b><span>'+esc(b.no)+'</span><small style="color:var(--pp-mut)">'+fd(b.date)+'</small></div></div>'
  +'<div class="meta"><div><small>Billed to</small>'+esc(b.name||'Walk-in customer')+(b.phone?'<br>'+esc(b.phone):'')+'</div><div><small>Vehicle</small>'+esc(b.vehicle||'—')+(b.reg?'<br>'+esc(b.reg):'')+'</div></div>'
  +(b.cats.length?'<div class="svc">'+b.cats.map(function(c){return '<span>'+esc(c)+'</span>'}).join('')+'</div>':'')
  +'<div class="scroll-x"><table><thead><tr><th>Description</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead><tbody>'+(rows.length?rows.map(function(r){return '<tr><td>'+esc(r[0])+'</td><td>'+r[1]+'</td><td>'+inr(r[2])+'</td><td>'+inr(r[3])+'</td></tr>'}).join(''):'<tr><td colspan="4" style="text-align:center;color:var(--pp-mut)">No line items</td></tr>')+'</tbody></table></div>'
  +'<div class="sumrow"><div class="stamp '+stp[1]+'">'+stp[0]+'</div><div class="tot"><div class="g"><span>Total</span><span>'+inr(b.total)+'</span></div><div><span>Received</span><span>'+inr(rc)+'</span></div>'+(disc>0.005?'<div><span>Discount</span><span>'+inr(disc)+'</span></div>':'')+'<div class="d"><span>'+(du>0?'Balance due':'Balance')+'</span><span>'+inr(du)+'</span></div></div></div>'
  +'<div class="foot">'+(du>0?'Payment pending.':'Paid in full.')+' Thank you for choosing us.</div></div>';
}
function billText(b){
  var p=S.profile,L=[];
  L.push('*'+(p.name||'CarvoX Garage')+'*');if(p.phone)L.push(p.phone);
  L.push('Invoice '+b.no+' · '+fd(b.date));
  L.push('Customer: '+(b.name||'Walk-in'));
  if(b.vehicle||b.reg)L.push('Vehicle: '+[b.vehicle,b.reg].filter(Boolean).join(' '));
  if(b.cats.length)L.push('Services: '+b.cats.join(', '));
  if(b.labour>0)L.push('- '+(b.details||'Service / labour')+': '+inr(b.labour));
  b.parts.concat(b.customs).forEach(function(x){L.push('- '+x.name+' x'+x.qty+': '+inr(x.price*x.qty))});
  var ad=adjOf(b);if(Math.abs(ad)>0.005)L.push('- '+(ad<0?'Discount':'Adjustment')+': '+inr(ad));L.push('Total: '+inr(b.total));L.push('Received: '+inr(received(b)));var dc=Math.max(0,b.total-received(b)-dueOf(b));if(dc>0.005)L.push('Discount: '+inr(dc));L.push('Due: '+inr(dueOf(b)));L.push('Status: '+(dueOf(b)<=0?'PAID':(received(b)>0?'PARTIAL':'UNPAID')));
  L.push('Thank you!');return L.join('\n');
}
function waLink(b){var ph=(b.phone||'').replace(/\D/g,'');if(ph.length===10)ph='91'+ph;return 'https://wa.me/'+ph+'?text='+encodeURIComponent(billText(b))}
function billView(id){
  var b=S.bills.find(function(x){return x.id===id});if(!b)return;
  var du=dueOf(b);
  openSheet(b.no,invoiceHtml(b)
  +(du>0?'<div class="noprint"><div class="blk">Record payment</div><div class="three" style="grid-template-columns:1fr 1fr auto"><input id="v_amt" type="number" inputmode="decimal" min="0" value="'+du+'" aria-label="Amount"><select id="v_mode" aria-label="Mode"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank transfer</option><option>Cheque</option></select><button class="btn sm" id="v_pay">Add</button></div></div>':'')
  +'<div class="noprint"><div class="btns2" style="margin-top:18px"><a class="btn" style="text-decoration:none" href="'+waLink(b)+'" target="_blank" rel="noopener">'+ic('wa')+'WhatsApp</a><button class="btn ghost" id="v_copy">'+ic('copy')+'Copy text</button></div><button class="btn ghost block" style="margin-top:12px" data-act="editBill" data-id="'+id+'">'+ic('check')+'Edit bill</button><button class="btn ghost block" style="margin-top:12px" id="v_print">'+ic('print')+'Print / PDF</button><button class="btn danger block" style="margin-top:12px" data-act="del" data-kind="bill" data-id="'+id+'">Delete bill</button></div>',function(){
    var pay=$('#v_pay');if(pay)pay.onclick=function(){var a=num($('#v_amt').value);if(a<=0){toast('Enter the amount');return}var dd=dueOf(b);b.payments.push({date:today(),amount:a,mode:$('#v_mode').value});b.due=Math.max(0,dd-a);save();render();billView(id);toast('Payment added')};
    $('#v_copy').onclick=function(){copyText(billText(b))};
    $('#v_print').onclick=function(){document.body.classList.add('printing');try{window.print()}catch(e){}setTimeout(function(){document.body.classList.remove('printing')},600);toast('If nothing opens, use WhatsApp or Copy text')};
  });
}
function chartSheet(kind){
  var m={earn:['Earnings',earn,1],exp:['Expenses',exps,1],profit:['Profit',prof,1],bills:['Bills',cnt,0],dues:['Pending dues',dues,1]}[kind];
  var days=[];for(var i=6;i>=0;i--)days.push(addDays(repDate,-i));
  var vals=days.map(m[1]),mx=Math.max.apply(null,vals.concat([1])),W=320,H=170,bw=30,gap=(W-7*bw)/8,s='';
  vals.forEach(function(v,i){var h=Math.max(v>0?3:0,v/mx*110),x=gap+i*(bw+gap),y=135-h;
    s+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+h+'" rx="6" fill="'+(i===6?'var(--acc)':'var(--panel2)')+'" stroke="var(--line)"/>';
    s+='<text class="v" x="'+(x+bw/2)+'" y="'+(y-6)+'" text-anchor="middle" font-size="10">'+(m[2]?(v>=1000?Math.round(v/100)/10+'k':Math.round(v)):v)+'</text>';
    s+='<text x="'+(x+bw/2)+'" y="152" text-anchor="middle" font-size="10">'+days[i].slice(8)+'/'+days[i].slice(5,7)+'</text>';});
  openSheet(m[0]+' · last 7 days','<svg class="chart" viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+m[0]+' for the 7 days ending '+fd(repDate)+'">'+s+'</svg><p class="hint">Ending '+fd(repDate)+'. The highlighted bar is the selected date.</p>');
}
function backupData(full){var o=JSON.parse(JSON.stringify(S));if(!full)o.bgimg='';return JSON.stringify(o)}
function exportFile(){
  var text=backupData(true),name='carvox-backup-'+today()+'.json',C=window.Capacitor,pl=C&&C.Plugins;
  if(C&&C.isNativePlatform&&C.isNativePlatform()&&pl&&pl.Filesystem&&pl.Share){
    pl.Filesystem.writeFile({path:name,data:text,directory:'CACHE',encoding:'utf8'})
      .then(function(r){return pl.Share.share({title:'CarvoX backup',dialogTitle:'Save your backup file',url:r.uri})})
      .then(function(){toast('Backup file ready')})
      .catch(function(e){if(/cancel|dismiss/i.test(String(e&&(e.message||e))))return;toast('Could not export. Use Copy text instead.')});
    return;
  }
  try{
    var u=URL.createObjectURL(new Blob([text],{type:'application/json'})),a=document.createElement('a');
    a.href=u;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(u);a.remove()},1500);
    toast('Backup file saved: '+name);
  }catch(err){copyText(text)}
}
function restoreFrom(text){
  try{var o=JSON.parse(text);if(!o||!Array.isArray(o.bills))throw 0;S=Object.assign(def(),o);save();applyUI();closeSheet();render();toast('Backup restored')}catch(e){toast('That does not look like a CarvoX backup')}
}
function restoreSheet(){openSheet('Paste & restore','<p class="hint" style="margin-top:0">Paste the backup text here. Restoring replaces the data on this phone.</p><textarea id="rs_t" rows="8" placeholder="Paste backup text"></textarea><div class="actions"><button class="btn ghost" data-act="closeSheet">Cancel</button><button class="btn" id="rs_go">Restore</button></div>',function(){$('#rs_go').onclick=function(){restoreFrom($('#rs_t').value)}})}
function infoSheet(){openSheet('What’s new','<div class="list"><div class="item"><div class="l"><b>Multi-select service categories</b><small style="white-space:normal">Pick every job done on one bill.</small></div></div><div class="item"><div class="l"><b>Stock linked to billing</b><small style="white-space:normal">Parts used on a bill reduce stock automatically.</small></div></div><div class="item"><div class="l"><b>Staff calendar</b><small style="white-space:normal">Tap days to mark attendance for the month.</small></div></div><div class="item"><div class="l"><b>Invoices</b><small style="white-space:normal">Share on WhatsApp, copy as text or print.</small></div></div></div>')}

/* ---------- events ---------- */
var ACT={
  tab:function(t){go(t.dataset.tab)},
  closeSheet:closeSheet,
  newBill:function(t){closeSheet();billSheet(t.dataset.id)},
  addStock:function(){stockSheet()},editStock:function(t){stockSheet(t.dataset.id)},
  addCustomer:function(){customerSheet()},editCustomer:function(t){customerSheet(t.dataset.id)},openCustomer:function(t){customerView(t.dataset.id)},
  addExpense:expenseSheet,addStaff:function(){staffSheet()},editStaff:function(t){staffSheet(t.dataset.id)},deleteStaff:function(t){deleteStaff(t.dataset.id)},markAtt:attSheet,staffCal:function(t){calSheet(t.dataset.id)},paySalary:salarySheet,
  addSupplier:supplierSheet,recordPurchase:purchaseSheet,
  openBill:function(t){closeSheet();billView(t.dataset.id)},
  editBill:function(t){billSheet(null,t.dataset.id)},
  info:infoSheet,
  chart:function(t){chartSheet(t.dataset.kind)},
  repDay:function(t){repDate=addDays(today(),+t.dataset.n);repMonth=repDate.slice(0,7);render()},
  backup:function(){openSheet('Backup','<p class="hint" style="margin-top:0">Your records live only on this phone. Export a file and keep it safe. Import it on a new phone to get everything back.</p><div class="btns2"><button class="btn" data-act="exportFile">'+ic('dl')+'Export file</button><button class="btn ghost" data-act="importFile">'+ic('ul')+'Import file</button></div><div class="btns2" style="margin-top:12px"><button class="btn ghost" data-act="backupCopy">'+ic('copy')+'Copy text</button><button class="btn ghost" data-act="backupRestore">Paste &amp; restore</button></div>')},
  exportFile:exportFile,
  importFile:function(){var i=$('#p_imp');i.value='';i.click()},
  backupCopy:function(){copyText(backupData())},
  backupRestore:restoreSheet,
  ui:function(t){S.ui[t.dataset.grp]=t.dataset.val;save();applyUI();render()},
  saveProfile:function(){
    var p=S.profile;p.name=$('#p_name').value.trim();p.phone=$('#p_phone').value.trim();p.address=$('#p_addr').value.trim();
    var f=$('#p_logo').files[0],fin=function(){save();applyUI();render();toast('Profile saved')};
    if(f)readImage(f,256,'image/png',function(u){p.logo=u;fin()});else fin();
  },
  resetBg:function(){S.ui.bg='garage';S.ui.vis=88;S.bgimg='';save();applyUI();render()},
  savePin:function(){var v=$('#p_pin').value.trim();if(!/^\d{4,8}$/.test(v)){toast('PIN must be 4 to 8 digits');return}S.pin=v;save();render();toast('PIN saved')},
  removePin:function(){S.pin='';save();render();toast('PIN removed')},
  resetAll:function(t){arm(t,function(){S=def();save();applyUI();render();toast('All data erased')})},
  del:function(t){arm(t,function(){doDel(t.dataset.kind,t.dataset.id)})}
};
function doDel(k,id){
  if(k==='bill'){var b=S.bills.find(function(x){return x.id===id});if(b)b.parts.forEach(function(p){var s=S.stock.find(function(x){return x.id===p.id});if(s)s.qty+=p.qty});S.bills=S.bills.filter(function(x){return x.id!==id})}
  else if(k==='customer')S.customers=S.customers.filter(function(x){return x.id!==id});
  else if(k==='stock')S.stock=S.stock.filter(function(x){return x.id!==id});
  else if(k==='supplier')S.suppliers=S.suppliers.filter(function(x){return x.id!==id});
  else if(k==='purchase')S.purchases=S.purchases.filter(function(x){return x.id!==id});
  else if(k==='att')S.attendance=S.attendance.filter(function(x){return x.id!==id});
  else if(k==='expense'){var e=S.expenses.find(function(x){return x.id===id});if(e&&e.salaryId)S.salaries=S.salaries.filter(function(x){return x.id!==e.salaryId});S.expenses=S.expenses.filter(function(x){return x.id!==id})}
  else if(k==='salary'){S.salaries=S.salaries.filter(function(x){return x.id!==id});S.expenses=S.expenses.filter(function(x){return x.salaryId!==id})}
  save();closeSheet();render();toast('Deleted');
}
document.addEventListener('click',function(e){
  if(e.target.id==='sheet'){closeSheet();return}
  var t=e.target.closest('[data-act]');if(!t)return;
  var f=ACT[t.dataset.act];if(f){e.preventDefault();f(t,e)}
});
var LISTS={bills:['L_bills',lBills],cust:['L_cust',lCust],stock:['L_stock',lStock],exp:['L_exp',lExp],staff:['L_staff',lStaff],att:['L_att',lAtt]};
document.addEventListener('input',function(e){
  var k=e.target.dataset&&e.target.dataset.q;
  if(k){q[k]=e.target.value;var l=LISTS[k];$('#'+l[0]).innerHTML=l[1]();return}
  if(e.target.id==='p_vis'){S.ui.vis=+e.target.value;$('#visl').textContent='Image visibility '+S.ui.vis+'%';applyUI();save()}
});
document.addEventListener('change',function(e){
  var id=e.target.id;
  if(id==='r_date'){repDate=e.target.value||today();repMonth=repDate.slice(0,7);render()}
  else if(id==='r_month'){repMonth=e.target.value;render()}
  else if(id==='p_bg'&&e.target.files[0]){readImage(e.target.files[0],1100,'image/jpeg',function(u){S.bgimg=u;S.ui.bg='mine';save();applyUI();render();toast('Wallpaper set')})}
  else if(id==='p_imp'&&e.target.files[0]){var inp=e.target,fr=new FileReader();fr.onload=function(){restoreFrom(String(fr.result));inp.value=''};fr.onerror=function(){toast('Could not read that file')};fr.readAsText(inp.files[0])}
});

/* ---------- lock ---------- */
function lock(){
  var el=$('#lockscr');el.hidden=false;
  el.innerHTML='<div class="box"><div class="logo" style="margin:0 auto;width:5em;height:5em">'+carSvg()+'</div><b style="font:700 1.6em var(--f-disp)">CarvoX</b><input id="lk" type="password" inputmode="numeric" maxlength="8" placeholder="PIN" aria-label="PIN"><button class="btn block" id="lk_go">Unlock</button></div>';
  var go_=function(){if($('#lk').value===S.pin){el.hidden=true;el.innerHTML=''}else{$('#lk').value='';toast('Wrong PIN')}};
  $('#lk_go').onclick=go_;$('#lk').onkeydown=function(e){if(e.key==='Enter')go_()};
}

buildNav();applyUI();render();
if(S.pin)lock();
})();
</script>
