name: CARVOX APK
run-name: CARVOX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: Build CARVOX Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install project dependencies
        run: npm install

      - name: Prepare CARVOX logo
        run: |
          mkdir -p assets

          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Current directory: $(pwd)"
          echo "Assets folder contents:"
          ls -la assets

          if [ -f "assets/icon.png" ]; then
            echo "CARVOX icon.png found"
          elif [ -f "assets/carvox-logo.png" ]; then
            cp "assets/carvox-logo.png" "assets/icon.png"
            echo "Copied carvox-logo.png to icon.png"
          else
            echo "ERROR: Logo not found in assets folder"
            find . -maxdepth 3 -type f
            exit 1
          fi

      - name: Build CARVOX web assets
        run: npm run build

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Generate Android launcher assets
        run: |
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#061326' \
            --splashBackgroundColor '#061326'

      - name: Sync Capacitor plugins
        run: npx cap sync android

      - name: Build CARVOX APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload CARVOX APK
        uses: actions/upload-artifact@v4
        with:
          name: CARVOX-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
