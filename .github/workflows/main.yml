name: CARVOX APK
run-name: CARVOX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: Build CARVOX Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install project dependencies
        run: npm install

      - name: Install native sharing and printing plugins
        run: npm install --save-exact @capgo/capacitor-file-sharer@7 @capgo/capacitor-printer@7.0.14

      - name: Prepare CarvoX logo
        run: |
          mkdir -p assets
          if [ -f assets/icon.png ]; then
            cp assets/icon.png assets/carvox-logo.png
          elif [ ! -f assets/carvox-logo.png ]; then
            echo "ERROR: assets/icon.png or assets/carvox-logo.png is required."
            exit 1
          fi

      - name: Build CarvoX web assets
        run: npm run build

      - name: Install Capacitor asset generator
        run: npm install --save-dev @capacitor/assets

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android app icon and splash assets
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#061326' --splashBackgroundColor '#061326'

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload CARVOX APK
        uses: actions/upload-artifact@v4
        with:
          name: CARVOX-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
