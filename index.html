<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#040a16">
<title>CarvoX</title>
<style>
:root,[data-theme="blue"]{
  --bg0:#040a16;--bg1:#0a1c3f;--accent:#2f8cff;--accent2:#5cb3ff;
  --text:#f2f7ff;--muted:#9db6d9;
  --card:rgba(28,84,190,.16);--card2:rgba(47,140,255,.26);
  --line:rgba(92,179,255,.26);--field:rgba(4,10,22,.72);
  --sheet1:#0c2250;--sheet2:#060e22;
  --nav:rgba(4,10,22,.88);--head:rgba(4,10,22,.74);
  --fade1:rgba(4,10,22,.55);--fade2:rgba(4,10,22,.9);
  --ok:#35d6a8;--warn:#ffb84d;--bad:#ff6b82;
  --glow:rgba(47,140,255,.45);--shadow:rgba(0,0,0,.4);
}
[data-theme="midnight"]{
  --bg0:#000000;--bg1:#070b14;--accent:#2f8cff;--accent2:#6bbcff;
  --text:#f5f7fb;--muted:#9aa6b8;
  --card:rgba(255,255,255,.055);--card2:rgba(47,140,255,.22);
  --line:rgba(255,255,255,.13);--field:rgba(255,255,255,.06);
  --sheet1:#0d121c;--sheet2:#05070c;
  --nav:rgba(0,0,0,.9);--head:rgba(0,0,0,.72);
  --fade1:rgba(0,0,0,.6);--fade2:rgba(0,0,0,.94);
  --glow:rgba(47,140,255,.38);
}
[data-theme="light"]{
  --bg0:#eef4ff;--bg1:#d7e6ff;--accent:#1f78f0;--accent2:#1259c4;
  --text:#0b1b36;--muted:#4f6285;
  --card:rgba(255,255,255,.78);--card2:rgba(31,120,240,.14);
  --line:rgba(31,100,200,.22);--field:#ffffff;
  --sheet1:#ffffff;--sheet2:#f1f6ff;
  --nav:rgba(255,255,255,.92);--head:rgba(238,244,255,.82);
  --fade1:rgba(238,244,255,.7);--fade2:rgba(238,244,255,.95);
  --ok:#0f9d78;--warn:#c27a00;--bad:#d63353;
  --glow:rgba(31,120,240,.3);--shadow:rgba(20,50,110,.18);
}

[data-theme="frosted"]{
  --bg0:#10151b;--bg1:#202a35;--accent:#d9e5f2;--accent2:#ffffff;
  --text:#f5f8fc;--muted:#b6c2cf;
  --card:rgba(225,238,250,.105);--card2:rgba(225,238,250,.19);
  --line:rgba(225,238,250,.22);--field:rgba(16,23,31,.58);
  --sheet1:rgba(35,46,58,.96);--sheet2:rgba(15,21,28,.97);
  --nav:rgba(17,24,32,.76);--head:rgba(17,24,32,.68);
  --fade1:rgba(10,15,21,.55);--fade2:rgba(10,15,21,.9);
  --ok:#75e0b5;--warn:#ffd080;--bad:#ff8297;
  --glow:rgba(220,235,250,.24);--shadow:rgba(0,0,0,.34);
}
[data-theme="frosted"] .card,
[data-theme="frosted"] .sheet,
[data-theme="frosted"] .nav,
[data-theme="frosted"] header,
[data-theme="frosted"] .topbar{
  backdrop-filter:blur(22px) saturate(145%);
  -webkit-backdrop-filter:blur(22px) saturate(145%);
}
[data-theme="frosted"] .card{
  background:linear-gradient(135deg,rgba(235,244,252,.13),rgba(140,165,190,.055));
  border-color:rgba(235,244,252,.19);
  box-shadow:0 8px 28px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.08);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);font-size:1rem;min-height:100vh;
  background:radial-gradient(900px 520px at 8% -8%,var(--glow),transparent 60%),linear-gradient(180deg,var(--bg1),var(--bg0) 65%);
  background-attachment:fixed;
}
#bgLayer{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;pointer-events:none}
#bgLayer::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--fade1),var(--fade2))}
#app{position:relative;z-index:1;max-width:680px;margin:0 auto;min-height:100vh}
header{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
  padding:max(env(safe-area-inset-top),12px) 16px 12px;
  background:var(--head);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}
.mark{width:46px;height:46px;border-radius:14px;flex:0 0 auto;overflow:hidden;display:grid;place-items:center;
  background:linear-gradient(135deg,#0b2a5b,var(--accent));box-shadow:0 0 20px var(--glow)}
.mark img{width:100%;height:100%;object-fit:contain;display:block}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:1.3rem;font-weight:800;letter-spacing:.3px;line-height:1.1}
.brand b i{font-style:normal;color:var(--accent2)}
.brand small{display:block;color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--accent2);background:var(--card);border:1px solid var(--line);padding:0}
main{padding:14px 16px calc(112px + env(safe-area-inset-bottom))}
h2{font-size:1.25rem;margin:0;letter-spacing:-.2px}
h3{font-size:.78rem;margin:22px 0 10px;color:var(--accent2);letter-spacing:1.2px;text-transform:uppercase}
p{margin:0}
.ic{display:block;flex:0 0 auto}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grid4 .stat{min-width:0;padding:10px 8px;overflow:hidden}
.grid4 .stat .l{font-size:.68rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid4 .stat .n{font-size:.92rem;line-height:1.25;white-space:nowrap;letter-spacing:-.25px}
@media(max-width:380px){.grid4{gap:5px}.grid4 .stat{padding:9px 5px}.grid4 .stat .l{font-size:.62rem}.grid4 .stat .n{font-size:.78rem}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 10px 26px var(--shadow),inset 0 1px 0 rgba(255,255,255,.07)}
.hero{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:20px;margin:6px 0 4px;
  background:linear-gradient(135deg,rgba(47,140,255,.42),rgba(11,42,91,.55));}
[data-theme="light"] .hero{background:linear-gradient(135deg,rgba(31,120,240,.22),rgba(255,255,255,.7))}
.hero small{letter-spacing:2px;font-size:.66rem;font-weight:800;color:var(--accent2)}
.hero h2{font-size:1.5rem;margin:6px 0 4px}
.hero p{color:var(--muted);font-size:.85rem}
.orb{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--accent),#1448a8);box-shadow:0 0 24px var(--glow)}
.stat{padding:14px}
.stat .l{color:var(--muted);font-size:.74rem}
.stat .n{font-size:1.3rem;font-weight:800;margin-top:4px;word-break:break-word}
.stat.hot{background:linear-gradient(135deg,rgba(47,140,255,.45),rgba(11,42,91,.5))}
[data-theme="light"] .stat.hot{background:linear-gradient(135deg,rgba(31,120,240,.3),rgba(255,255,255,.7))}
button.stat{text-align:left;color:inherit;font:inherit;cursor:pointer;width:100%}
.stat .foot{font-size:.66rem;color:var(--muted);margin-top:6px}
button,.btn{font:inherit;color:var(--text);cursor:pointer;background:var(--card2);border:1px solid var(--line);
  border-radius:14px;padding:11px 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
button:active{transform:scale(.97)}
.primary{background:linear-gradient(135deg,var(--accent),#1b5fd6);color:#fff;border-color:transparent;font-weight:700;box-shadow:0 6px 18px var(--glow)}
.danger{background:rgba(255,107,130,.14);border-color:rgba(255,107,130,.5);color:var(--bad)}
.sm{padding:8px 12px;font-size:.84rem;border-radius:12px}
.full{width:100%}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa button{justify-content:flex-start;padding:13px 14px;border-radius:16px;background:var(--card);font-size:.9rem;text-align:left}
.qa button .ib{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--card2);color:var(--accent2)}
.qa button.primary .ib{background:rgba(255,255,255,.2);color:#fff}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;cursor:pointer;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.item:active{background:var(--card2)}
.av{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:0 0 auto;background:var(--card2);color:var(--accent2)}
.av.low{background:rgba(255,184,77,.2);color:var(--warn)}
.body{flex:1;min-width:0}
.t{font-weight:700;word-break:break-word}
.m{color:var(--muted);font-size:.8rem;margin-top:2px;word-break:break-word}
.side{text-align:right;flex:0 0 auto}
.side .t{font-size:1rem}
.chip{display:inline-block;font-size:.68rem;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--accent2);margin-top:5px;margin-right:4px}
.chip.ok{color:var(--ok);border-color:rgba(53,214,168,.45)}
.chip.warn{color:var(--warn);border-color:rgba(255,184,77,.5)}
.chip.bad{color:var(--bad);border-color:rgba(255,107,130,.5)}
.empty{text-align:center;color:var(--muted);padding:24px 12px;border:1px dashed var(--line);border-radius:18px;font-size:.9rem}
.note{color:var(--muted);font-size:.78rem;line-height:1.45;margin-top:8px}
.search{position:relative;margin-bottom:12px}
.search input{padding-left:40px}
.search .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
input,select,textarea{width:100%;font:inherit;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:13px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
input[type=range]{padding:0;accent-color:var(--accent)}
option{background:#0a1a3a;color:#fff}
label{display:block;font-size:.76rem;color:var(--muted);margin:13px 0 5px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.fg .full{grid-column:1/-1}
.row{display:flex;gap:8px;align-items:center}
.row.sb{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.row>*{min-width:0}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;
  background:var(--nav);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav .in{display:flex;width:100%;max-width:680px}
nav button{flex:1;min-width:0;flex-direction:column;gap:3px;background:none;border:none;border-radius:12px;color:var(--muted);font-size:.62rem;padding:7px 0}
nav button.on{color:var(--text);background:var(--card2);box-shadow:0 0 16px var(--glow)}
nav button.on .ic{color:var(--accent2)}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(2,6,16,.72);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:680px;max-height:92vh;overflow:auto;background:linear-gradient(180deg,var(--sheet1),var(--sheet2));
  border:1px solid var(--line);border-bottom:none;border-radius:26px 26px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom));color:var(--text)}
.sheet.small{max-height:70vh}
.handle{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.sh h2{font-size:1.15rem}
.xbtn{width:36px;height:36px;padding:0;border-radius:50%}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.actions>button{flex:1 1 40%}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:99;background:var(--accent);color:#fff;padding:10px 18px;border-radius:99px;font-size:.88rem;box-shadow:0 8px 24px var(--shadow);max-width:90vw;text-align:center}
#errbar{display:none;position:fixed;top:0;left:0;right:0;z-index:999;background:#7a1020;color:#fff;font-size:.75rem;padding:8px 12px;word-break:break-word}
.bar{height:10px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:10px}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}
.sel{display:flex;gap:8px;align-items:center}
.sel select{flex:1}
.pill-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.pr{display:flex;gap:8px;align-items:center;margin-top:8px}
.pr .d{flex:1;min-width:0}
.pr .x{flex:0 0 auto;width:36px;height:36px;padding:0}
.total{font-size:1.4rem;font-weight:800;text-align:right;margin-top:6px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cal .w{font-size:.66rem;color:var(--muted);text-align:center}
.cal .d{aspect-ratio:1;display:grid;place-items:center;border-radius:11px;background:var(--card);border:1px solid var(--line);font-size:.85rem;padding:0}
.cal .d.p{background:rgba(53,214,168,.28);border-color:rgba(53,214,168,.6)}
.cal .d.a{background:rgba(255,107,130,.28);border-color:rgba(255,107,130,.6)}
.cal .d.l{background:rgba(255,184,77,.28);border-color:rgba(255,184,77,.6)}
.cal .d.h{background:rgba(92,179,255,.3);border-color:rgba(92,179,255,.65)}
.cal .d.t{outline:2px solid var(--accent2)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.74rem;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* paper invoice */
.paper{background:#fff;color:#0b1b36;border-radius:16px;padding:18px;font-size:.88rem}
.paper h1{font-size:1.2rem;margin:0}
.paper .ph2{display:flex;gap:12px;align-items:center;border-bottom:2px solid #1f78f0;padding-bottom:12px;margin-bottom:12px}
.paper .ph2 img{width:54px;height:54px;object-fit:contain;border-radius:10px}
.paper table{width:100%;border-collapse:collapse;margin:10px 0}
.paper th,.paper td{padding:7px 4px;border-bottom:1px solid #e3eaf6;text-align:left;font-size:.82rem}
.paper th:last-child,.paper td:last-child,.paper th:nth-child(2),.paper td:nth-child(2){text-align:right}
.paper .tot{display:flex;justify-content:space-between;padding:4px 0}
.paper .tot.big{font-size:1.1rem;font-weight:800;border-top:2px solid #0b1b36;margin-top:6px;padding-top:8px}
.paper .stamp{display:inline-block;border:2px solid;border-radius:8px;padding:2px 10px;font-weight:800;font-size:.8rem;transform:rotate(-4deg)}
.paper .stamp.ok{color:#0f9d78}.paper .stamp.warn{color:#c27a00}.paper .stamp.bad{color:#d63353}
.paper .foot{text-align:center;color:#506384;font-size:.76rem;margin-top:12px}
.pie{display:grid;place-items:center;padding:6px 0}
.lg{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:13px;background:var(--card);margin-top:8px;font-size:.85rem}
.lg i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:9px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px 6px;font-size:.85rem}
.seg button.on{background:linear-gradient(135deg,var(--accent),#1b5fd6);color:#fff;border-color:transparent;font-weight:700}
#lock{position:fixed;inset:0;z-index:1000;background:var(--bg0);display:flex;align-items:center;justify-content:center;padding:24px}
#printArea{display:none}
@media print{
  @page{size:auto;margin:10mm}
  html,body{background:#fff!important;margin:0!important;padding:0!important}
  body.printing #app,body.printing .overlay,body.printing #bgLayer,body.printing nav,body.printing header,body.printing #errbar{display:none!important}
  body.printing #printArea{display:block!important;position:static!important;width:100%!important;background:#fff!important;color:#0b1b36!important}
  body.printing #printArea .paper{display:block!important;width:100%!important;max-width:100%!important;margin:0 auto!important;border-radius:0!important;padding:8mm!important;box-shadow:none!important;break-inside:avoid;page-break-inside:avoid}
  body.printing #printArea .paper *{color:#0b1b36!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.printing #printArea .paper .stamp.ok{color:#0f9d78!important}
  body.printing #printArea .invoice-print-image{display:block!important;width:100%!important;height:auto!important;max-width:100%!important;object-fit:contain!important}
}


/* ==========================================================
   CARVOX — FROSTED GLASS / MINIMAL MONOCHROME DESIGN SYSTEM
   Scoped to [data-theme="frosted"] so the other themes stay intact.
   Inspired by the supplied minimal Nothing-style reference.
   ========================================================== */
[data-theme="frosted"]{
  --bg0:#080808;--bg1:#0d0d0e;
  --accent:#f3f3f3;--accent2:#fafafa;
  --text:#f5f5f5;--muted:#9b9b9b;
  --card:rgba(255,255,255,.065);--card2:rgba(255,255,255,.105);
  --line:rgba(255,255,255,.13);--field:rgba(255,255,255,.055);
  --sheet1:rgba(35,35,37,.94);--sheet2:rgba(13,13,14,.97);
  --nav:rgba(27,27,28,.78);--head:rgba(8,8,8,.72);
  --fade1:rgba(0,0,0,.18);--fade2:rgba(0,0,0,.68);
  --ok:#a9e5ca;--warn:#e9d4a5;--bad:#ef9ca7;
  --glow:rgba(255,255,255,.075);--shadow:rgba(0,0,0,.42);
  color-scheme:dark;
}
body[data-theme="frosted"]{
  background:radial-gradient(700px 420px at 88% 0%,rgba(255,255,255,.055),transparent 62%),
             radial-gradient(600px 500px at -15% 42%,rgba(255,255,255,.025),transparent 65%),
             linear-gradient(180deg,#0b0b0c 0%,#070707 58%,#050505 100%);
}
[data-theme="frosted"] #bgLayer{filter:grayscale(1) saturate(.35)}
[data-theme="frosted"] header{
  background:rgba(8,8,8,.56);border-bottom-color:transparent;
  backdrop-filter:blur(24px) saturate(125%);-webkit-backdrop-filter:blur(24px) saturate(125%);
}
[data-theme="frosted"] .mark{
  background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.13);
  box-shadow:0 8px 22px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.1);
}
[data-theme="frosted"] .brand b{letter-spacing:.7px}
[data-theme="frosted"] .brand b i{color:#fff}
[data-theme="frosted"] .brand small{color:#898989}
[data-theme="frosted"] .hbtn{
  color:#f5f5f5;background:rgba(255,255,255,.055);
  border-color:rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
}
[data-theme="frosted"] main{padding:18px 18px calc(136px + env(safe-area-inset-bottom))}
[data-theme="frosted"] h2{font-weight:760;letter-spacing:-.65px}
[data-theme="frosted"] h3{
  color:#bcbcbc;font-size:.68rem;letter-spacing:1.85px;
  font-weight:750;text-transform:uppercase;
}
[data-theme="frosted"] .card,
[data-theme="frosted"] .item,
[data-theme="frosted"] .lg{
  background:linear-gradient(145deg,rgba(255,255,255,.092),rgba(255,255,255,.032));
  border:1px solid rgba(255,255,255,.125);border-radius:25px;
  backdrop-filter:blur(28px) saturate(135%);-webkit-backdrop-filter:blur(28px) saturate(135%);
  box-shadow:0 14px 36px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.075);
}
[data-theme="frosted"] .card{padding:17px}
[data-theme="frosted"] .hero{
  padding:22px;border-radius:29px;margin:8px 0 6px;overflow:hidden;
  background:radial-gradient(circle at 100% 0%,rgba(255,255,255,.105),transparent 42%),
             linear-gradient(145deg,rgba(255,255,255,.115),rgba(255,255,255,.035));
  border:1px solid rgba(255,255,255,.15);
}
[data-theme="frosted"] .hero small{color:#bcbcbc;letter-spacing:2.15px}
[data-theme="frosted"] .hero h2{font-size:1.58rem;font-weight:780;letter-spacing:-1px}
[data-theme="frosted"] .hero p{color:#a5a5a5}
[data-theme="frosted"] .orb{

<body>

<div id="app">
  <header>
    <div class="mark" id="mark"></div>
    <div class="brand"><b>Carvo<i>X</i></b><small id="gname"></small></div>
    <button class="hbtn" id="hInfo" aria-label="About"></button>

<script>
(function(){
"use strict";

/* ================= error bar ================= */
function showErr(m){var b=document.getElementById('errbar');if(b){b.style.display='block';b.textContent='Error: '+m}}
window.addEventListener('error',function(e){showErr(e.message||'unknown')});
window.addEventListener('unhandledrejection',function(e){showErr(String((e.reason&&e.reason.message)||e.reason))});

/* ================= helpers ================= */
var KEY='garage_os_fresh_v1',VERSION='4.0';
var $=function(s,r){return (r||document).querySelector(s)};
var num=function(v){var n=parseFloat(v);return isFinite(n)?n:0};
var pad=function(n){return String(n).padStart(2,'0')};
var dstr=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var today=function(){return dstr(new Date())};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)};
var money=function(n){return '₹'+num(n).toLocaleString('en-IN',{maximumFractionDigits:2})};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var byId=function(a,id){for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null};
var lc=function(s){return String(s==null?'':s).toLowerCase()};
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2000)}

var IC={
home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',

idcard:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.5-1.6 1.7-2.5 3-2.5s2.5.9 3 2.5M15 10h3M15 13h3"/>',
wallet:'<path d="M3 7a2 2 0 012-2h13v4"/><path d="M3 7v11a2 2 0 002 2h15a1 1 0 001-1v-9a1 1 0 00-1-1H5a2 2 0 01-2-2"/><circle cx="17" cy="14.5" r="1"/>',

truck:'<path d="M2 6h11v10H2zM13 9h4l3 3v4h-7"/><circle cx="6.5" cy="17.5" r="1.7"/><circle cx="16.5" cy="17.5" r="1.7"/>',
lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 00-1-1H5a1 1 0 00-1 1v10a1 1 0 001 1h3"/>',
download:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',

};
function ic(n,s){s=s||20;return '<svg class="ic" viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(IC[n]||'')+'</svg>'}

/* ================= data ================= */
function emptyData(){return{customers:[],stock:[],jobs:[],bills:[],expenses:[],staff:[],attendance:[],suppliers:[],purchases:[],salaryPayments:[],billPayments:[],settings:{theme:'frosted'}}}
function load(){
  var d={};
  try{d=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){d={}}
  return normalize(d);
}
function normalize(d){
  var base=emptyData(),out={};
  if(d&&d.data&&typeof d.data==='object'&&!Array.isArray(d.data)&&(d.app||d._backupInfo))d=d.data;
  Object.keys(d||{}).forEach(function(k){out[k]=d[k]});
  Object.keys(base).forEach(function(k){
    if(k==='settings')out.settings=Object.assign({},base.settings,(d&&d.settings&&typeof d.settings==='object')?d.settings:{});
    else out[k]=Array.isArray(d&&d[k])?d[k]:[];
  });
  delete out._backupInfo;
  return out;
}
var data=load();
/* Version 4.0 first-run migration: set Frosted Glass as the default once, while keeping all themes selectable. */
if(!data.settings.carvoxV4ThemeDefault){data.settings.theme='frosted';data.settings.carvoxV4ThemeDefault=true;try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){showErr('Storage is full or blocked. Export a backup.')}}
function persist(){save();render()}
var KEYMAP={customer:'customers',stock:'stock',bill:'bills',expense:'expenses',staff:'staff',attendance:'attendance',supplier:'suppliers',purchase:'purchases',salary:'salaryPayments',billpay:'billPayments'};

/* ================= look & feel ================= */
var BG_STYLE='gm_liquid_bg_style_v3',BG_OP='gm_liquid_bg_opacity_v3',BG_CUSTOM='gm_liquid_bg_custom_v3';
function themeName(){var t=data.settings.theme;return t==='light'?'light':(t==='dark'||t==='midnight')?'midnight':t==='frosted'?'frosted':'blue'}
function bgState(){
  var s='cars',o='88',c='';
  try{s=localStorage.getItem(BG_STYLE)||'cars';o=localStorage.getItem(BG_OP)||'88';c=localStorage.getItem(BG_CUSTOM)||''}catch(e){}
  if(s==='green')s='blue';
  if(s==='custom'&&!c)s='cars';
  return{s:s,o:num(o),c:c};
}
function applyLook(){
  var activeTheme=themeName();
  document.body.setAttribute('data-theme',activeTheme);
  var metaTheme=document.querySelector('meta[name="theme-color"]');
  if(metaTheme)metaTheme.setAttribute('content',activeTheme==='frosted'?'#080808':activeTheme==='midnight'?'#000000':activeTheme==='light'?'#eef4ff':'#040a16');
  document.documentElement.style.fontSize=(16*(num(data.settings.fontScale)||1))+'px';
  var b=bgState(),L=$('#bgLayer'),img='none';
  if(b.s==='cars')img='url("garage-bg.png")';else if(b.s==='custom')img='url("'+b.c+'")';
  L.style.backgroundImage=img;
  /* Keep wallpapers subtle in the monochrome glass theme without disabling its control. */
  L.style.opacity=String(Math.max(0,Math.min(1,b.o/100))*(activeTheme==='frosted'?0.22:0.6));
}

/* ================= sheets (with Android back support) ================= */
var stack=[],ignorePops=0;
function openSheet(html,cls){
  var o=document.createElement('div');o.className='overlay';
  o.innerHTML='<div class="sheet '+(cls||'')+'"><div class="handle"></div>'+html+'</div>';
  o.addEventListener('click',function(e){if(e.target===o)closeSheet()});
  document.body.appendChild(o);stack.push(o);
  try{history.pushState({cx:stack.length},'')}catch(e){}
  return o;
}
function closeSheet(){
  var o=stack.pop();if(!o)return;o.remove();
  ignorePops++;try{history.back()}catch(e){ignorePops--}
}
function closeAll(){
  var n=stack.length;if(!n)return;
  while(stack.length)stack.pop().remove();
  ignorePops++;try{history.go(-n)}catch(e){ignorePops--}
}
window.addEventListener('popstate',function(){
  if(ignorePops>0){ignorePops--;return}
  var o=stack.pop();if(o)o.remove();
});
function sheetHead(title){return '<div class="sh"><h2>'+title+'</h2><button class="xbtn" onclick="CX.close()" aria-label="Close">'+ic('x',18)+'</button></div>'}
function ask(msg,label,fn,danger){
  var o=openSheet(sheetHead('Please confirm')+'<p style="color:var(--muted);line-height:1.5">'+esc(msg)+'</p><div class="actions"><button onclick="CX.close()">Cancel</button><button id="askOk" class="'+(danger===false?'primary':'danger')+'">'+esc(label||'Delete')+'</button></div>','small');
  $('#askOk',o).addEventListener('click',function(){closeSheet();fn()});
}

/* ================= navigation ================= */
var page='home',search={};
var NAV=[['home','home','Home'],['stock','box','Stock'],['bills','receipt','Bills'],['customers','users','Customers'],['staff','idcard','Staff'],['expenses','wallet','Expenses'],['reports','chart','Reports']];
function go(p){page=p;closeAll();render();window.scrollTo(0,0)}
function renderNav(){
  $('#nav').innerHTML=NAV.map(function(n){return '<button class="'+(page===n[0]?'on':'')+'" onclick="CX.go(\''+n[0]+'\')">'+ic(n[1],21)+n[2]+'</button>'}).join('');
}
var FALLBACK_LOGO='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7fc4ff"/><stop offset="1" stop-color="#1768d4"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="#061326"/><rect x="24" y="24" width="464" height="464" rx="96" fill="url(#g)" opacity=".18" stroke="#6fbaff" stroke-width="8"/><path d="M310 145a126 126 0 1 0 0 222" fill="none" stroke="#eaf5ff" stroke-width="48" stroke-linecap="round"/><path d="M328 164v184M328 256h112" fill="none" stroke="#4b9cff" stroke-width="42" stroke-linecap="round"/></svg>');
function renderHeader(){
  var s=data.settings;
  $('#gname').textContent=(s.garageName||'').trim()||'Smart Garage Manager';
  var m=$('#mark');
  var src=s.garageLogo||'assets/carvox-logo.png';
  m.innerHTML='<img alt="Logo">';
  var im=$('img',m);
  im.addEventListener('error',function(){im.onerror=null;im.src=FALLBACK_LOGO},{once:true});
  im.src=src;
  $('#hInfo').innerHTML=ic('info',20);
  $('#hSet').innerHTML=ic('gear',20);
}
function render(){
  try{applyLook()}catch(e){showErr('Appearance: '+(e&&e.message?e.message:e))}
  // Keep the app shell usable even if a specific page has a rendering problem.
  try{renderNav()}catch(e){showErr('Navigation: '+(e&&e.message?e.message:e))}
  try{renderHeader()}catch(e){showErr('Header: '+(e&&e.message?e.message:e))}
  try{
    var v=VIEW[page]||VIEW.home;
    if(typeof v!=='function')throw new Error('Page is not available: '+page);
    $('#page').innerHTML=v();
  }catch(e){
    showErr('Page error: '+(e&&e.message?e.message:e));
    $('#page').innerHTML='<div class="empty">This section could not be displayed. Your saved records have not been deleted. Open another tab or restart CarvoX.</div>';
  }
}
function setSearch(name,v){
  search[name]=v;
  var el=$('#list-'+name);
  if(el&&LISTS[name])el.innerHTML=LISTS[name]();
}
function searchBox(name,ph){return '<div class="search">'+ic('search',18)+'<input placeholder="'+esc(ph)+'" value="'+esc(search[name]||'')+'" oninput="CX.search(\''+name+'\',this.value)"></div>'}

function head(title,btnHtml){return '<div class="ph"><h2>'+title+'</h2>'+(btnHtml||'')+'</div>'}
function addBtn(label,fn){return '<button class="primary sm" onclick="'+fn+'">'+ic('plus',16)+label+'</button>'}
function empty(msg){return '<div class="empty">'+msg+'</div>'}

/* ================= form engine ================= */
var CATS=['ALIGNMENT','BALANCING','DENTING','PAINTING','REPAIRS','WASHING','ELECTRICAL WORK','AC WORK','INSURANCE','OTHER'];
var MODES=['Cash','UPI','Bank transfer','Card','Cheque','Other'];
function F(k,l,t,o,x){return Object.assign({k:k,l:l,t:t||'text',o:o},x||{})}
var SCHEMA={

function refOptions(t){
  if(t==='ref:stock')return data.stock.map(function(x){return{v:x.id,l:(x.name||x.partNo||'Item')+' · '+num(x.qty)+' left'}});
  if(t==='ref:staff')return data.staff.map(function(x){return{v:x.id,l:x.name||'Staff'}});
  if(t==='ref:supplier')return data.suppliers.map(function(x){return{v:x.id,l:x.name||'Supplier'}});
  if(t==='ref:bill')return data.bills.map(function(x){return{v:x.id,l:(x.billNo||'Bill')+' · '+(x.customer||'')+' · due '+money(x.balance)}});
  return [];
}
function fieldHTML(f,v){
  var h='<div class="'+(f.full?'full':'')+'"><label>'+esc(f.l)+(f.req?' *':'')+'</label>';
  if(f.t==='select'){
    h+='<select name="'+f.k+'">'+f.o.map(function(o){return '<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>';
  }else if(f.t.indexOf('ref:')===0){
    h+='<select name="'+f.k+'"><option value="">Choose…</option>'+refOptions(f.t).map(function(o){return '<option value="'+esc(o.v)+'"'+(o.v===v?' selected':'')+'>'+esc(o.l)+'</option>'}).join('')+'</select>';
  }else if(f.t==='textarea'){
    h+='<textarea name="'+f.k+'" rows="3">'+esc(v)+'</textarea>';
  }else if(f.t==='checkbox'){
    h+='<input type="checkbox" name="'+f.k+'"'+(v?' checked':'')+'>';
  }else{
    h+='<input name="'+f.k+'" type="'+f.t+'" value="'+esc(v)+'"'+(f.t==='number'?' step="any" inputmode="decimal" min="0"':'')+'>';
  }
  return h+'</div>';
}
function openForm(type,id,pre){
  var sc=SCHEMA[type],arr=data[KEYMAP[type]],old=id?(byId(arr,id)||{}):{};
  var vals=Object.assign({},pre||{},old);
  var h=sheetHead((id?'Edit ':'Add ')+sc.title)+'<form id="gf" autocomplete="off"><div class="fg">';
  sc.fields.forEach(function(f){
    var v=vals[f.k];
    if(v==null){
      if(f.t==='date')v=today();else if(f.t==='month')v=today().slice(0,7);
      else v=f.d!=null?f.d:'';
    }
    h+=fieldHTML(f,v);
  });
  h+='</div><div class="actions"><button type="button" onclick="CX.close()">Cancel</button><button type="submit" class="primary">Save</button></div></form>';
  var o=openSheet(h);
  $('#gf',o).addEventListener('submit',function(e){
    e.preventDefault();
    var out={};
    for(var i=0;i<sc.fields.length;i++){
      var f=sc.fields[i],el=this.elements[f.k];
      if(f.t==='checkbox'){out[f.k]=el.checked;continue}
      var v=String(el.value).trim();
      if(f.req&&!v){toast(f.l+' is required');el.focus();return}
      out[f.k]=f.t==='number'?num(v):v;
    }
    saveRecord(type,id,out);
  });
}
function upsert(type,id,obj){
  var arr=data[KEYMAP[type]];
  if(id){var i=arr.findIndex(function(x){return x.id===id});if(i>=0){arr[i]=Object.assign({},arr[i],obj);return arr[i]}}
  var rec=Object.assign({id:uid(),createdAt:new Date().toISOString()},obj);arr.unshift(rec);return rec;
}
function saveRecord(type,id,o){
  if(type==='attendance'){
    var st=byId(data.staff,o.staffId);o.staffName=st?st.name:'Staff member';
    if(!o.date)o.date=today();
    if(!id){var ex=data.attendance.find(function(x){return x.staffId===o.staffId&&x.date===o.date});if(ex)id=ex.id}
  }
  if(type==='purchase'){
    var s=byId(data.stock,o.partId);
    if(!s){toast('Select a stock item');return}
    if(o.qty<=0){toast('Enter purchase quantity');return}
    if(!o.unitCost)o.unitCost=num(s.buy);
    s.qty=num(s.qty)+o.qty;s.buy=o.unitCost;
    var sup=byId(data.suppliers,o.supplierId);
    var rec=upsert('purchase',null,o);
    if(o.addExpense){
      data.expenses.unshift({id:uid(),createdAt:new Date().toISOString(),title:'Stock purchase: '+(s.name||s.partNo||'item'),category:'Stock purchase',paidTo:sup?sup.name:'',amount:o.paid?o.paid:o.qty*o.unitCost,date:o.date||today(),paymentMode:o.paymentMode||'Cash',notes:'Auto-created from stock purchase',purchaseId:rec.id});
    }
    closeSheet();persist();toast('Purchase recorded');return;
  }
  if(type==='salary'){
    var e=byId(data.staff,o.staffId);o.staffName=e?e.name:'Employee';
    var r2=upsert('salary',null,o);
    data.expenses.unshift({id:uid(),createdAt:new Date().toISOString(),title:'Salary payment: '+o.staffName,category:'Staff salary',paidTo:o.staffName,amount:o.amount,date:o.date||today(),paymentMode:o.mode||'Cash',notes:'Auto-created from salary payment',salaryId:r2.id});
    if(e){e.salaryStatus='Paid'}
    closeSheet();persist();toast('Salary recorded');return;
  }
  if(type==='billpay'){
    var b=byId(data.bills,o.billId);
    if(!b){toast('Select a bill');return}
    if(o.amount<=0){toast('Enter an amount');return}
    b.paid=num(b.paid)+o.amount;
    b.balance=Math.max(0,num(b.balance)-o.amount);
    if(o.mode)b.paymentMode=o.mode;
    o.billNo=b.billNo||'';o.customer=b.customer||'';
    upsert('billpay',null,o);
    closeSheet();persist();toast('Payment received');return;
  }
  upsert(type,id,o);
  closeSheet();persist();toast('Saved');
}
function removeRecord(type,id){
  ask('Delete this record? This cannot be undone.','Delete',function(){
    var k=KEYMAP[type],arr=data[k];
    if(type==='bill'){
      var b=byId(data.bills,id);
      if(b){(b.items||[]).forEach(function(it){var s=byId(data.stock,it.stockId);if(s)s.qty=num(s.qty)+num(it.qty)})}
      data.billPayments=data.billPayments.filter(function(p){return p.billId!==id});
    }
    if(type==='billpay'){
      var p=byId(data.billPayments,id),bb=p&&byId(data.bills,p.billId);
      if(bb){bb.paid=Math.max(0,num(bb.paid)-num(p.amount));bb.balance=num(bb.balance)+num(p.amount)}
    }
    if(type==='purchase'){
      var pu=byId(data.purchases,id),ss=pu&&byId(data.stock,pu.partId);
      if(ss)ss.qty=Math.max(0,num(ss.qty)-num(pu.qty));
      data.expenses=data.expenses.filter(function(x){return x.purchaseId!==id});
    }
    if(type==='salary'){data.expenses=data.expenses.filter(function(x){return x.salaryId!==id})}
    if(type==='staff'){data.attendance=data.attendance.filter(function(a){return a.staffId!==id})}
    data[k]=arr.filter(function(x){return x.id!==id});
    closeAll();persist();toast('Deleted');
  });
}

var parts=[],customs=[],billEditId=null;
function nextBillNo(){
  var last=data.bills.length?data.bills[0].billNo:'';
  var m=/^(.*?)(\d+)$/.exec(String(last||''));
  if(m){var n=String(parseInt(m[2],10)+1);return m[1]+n.padStart(m[2].length,'0')}
  return 'CX-'+String(data.bills.length+1).padStart(4,'0');
}
function partsTotal(){return parts.reduce(function(a,i){return a+num(i.qty)*num(i.price)},0)}
function customsTotal(){return customs.reduce(function(a,i){return a+num(i.qty||1)*num(i.price)},0)}
function recalcBill(setAmount){
  var sc=num(($('#b_serviceCharge')||{}).value);
  var total=partsTotal()+customsTotal()+sc;
  if(setAmount&&$('#b_amount'))$('#b_amount').value=total.toFixed(2);
  var amt=num(($('#b_amount')||{}).value),paid=num(($('#b_paid')||{}).value);
  var d=$('#b_due');if(d)d.textContent=money(Math.max(0,amt-paid));
}

function addPart(){
  var id=$('#b_stock').value,qty=Math.floor(num($('#b_sqty').value));
  var s=byId(data.stock,id);
  if(!s){toast('Choose a stock item');return}
  if(qty<1){toast('Quantity must be at least 1');return}
  var ex=parts.find(function(p){return p.stockId===id});
  if(ex)ex.qty+=qty;else parts.push({stockId:id,name:s.name||s.partNo||'Stock item',partNo:s.partNo||'',qty:qty,price:num(s.sell)});
  $('#b_stock').value='';$('#b_sqty').value=1;renderBillLists();
}
function addCustom(){
  var name=$('#b_cname').value.trim(),price=num($('#b_cprice').value),qty=Math.max(1,Math.floor(num($('#b_cqty').value)||1));
  if(!name){toast('Enter item name');return}
  customs.push({name:name,price:price,qty:qty});
  $('#b_cname').value='';$('#b_cprice').value='';$('#b_cqty').value=1;renderBillLists();
}
function estProfit(){
  var m=parts.reduce(function(a,p){var s=byId(data.stock,p.stockId);return a+(num(p.price)-(s?num(s.buy):0))*num(p.qty)},0);
  $('#b_profit').value=(num($('#b_serviceCharge').value)+m).toFixed(2);
}
function stockDelta(oldItems,newItems){
  var delta={};
  (oldItems||[]).forEach(function(it){delta[it.stockId]=(delta[it.stockId]||0)+num(it.qty)});
  (newItems||[]).forEach(function(it){delta[it.stockId]=(delta[it.stockId]||0)-num(it.qty)});
  for(var id in delta){var s=byId(data.stock,id);if(s&&num(s.qty)+delta[id]<0)return{ok:false,name:s.name||s.partNo,avail:num(s.qty)}}
  return{ok:true,delta:delta};
}
function saveBill(){
  var old=billEditId?byId(data.bills,billEditId):null;
  var obj={
    billNo:$('#b_billNo').value.trim(),date:$('#b_date').value||today(),
    customer:$('#b_customer').value.trim(),phone:$('#b_phone').value.trim(),vehicle:$('#b_vehicle').value.trim(),reg:$('#b_reg').value.trim(),
    category:Array.prototype.slice.call(document.querySelectorAll('.b_category_option:checked')).map(function(x){return x.value}).join(', '),description:$('#b_description').value.trim(),
    serviceCharge:num($('#b_serviceCharge').value),items:parts.map(function(x){return Object.assign({},x)}),customItems:customs.map(function(x){return Object.assign({},x)}),
    paymentMode:$('#b_mode').value,profit:num($('#b_profit').value)
  };
  var calc=partsTotal()+customsTotal()+obj.serviceCharge;
  obj.amount=$('#b_amount').value===''?calc:num($('#b_amount').value);
  obj.paid=num($('#b_paid').value);
  obj.balance=Math.max(0,obj.amount-obj.paid);
  if(!obj.customer&&!obj.vehicle&&!obj.amount){toast('Add a customer or some amount');return}
  var chk=stockDelta(old?old.items:[],obj.items);
  if(!chk.ok){toast('Not enough stock for '+chk.name+' (only '+chk.avail+')');return}
  for(var id in chk.delta){var s=byId(data.stock,id);if(s)s.qty=num(s.qty)+chk.delta[id]}
  var rec=upsert('bill',billEditId,obj);
  closeAll();persist();toast('Bill saved');
  setTimeout(function(){viewBill(rec.id)},60);
}
function billItems(b){return (b.items||[]).concat(b.customItems||[])}
function billStatus(b){var due=num(b.balance);return due<=0?['Paid','ok']:(num(b.paid)>0?['Partial','warn']:['Unpaid','bad'])}
function waNumber(p){var d=String(p||'').replace(/\D/g,'');if(d.length===10)d='91'+d;return d}
function invoiceText(b){
  var s=data.settings,t=(s.garageName||'CarvoX')+'\n'+(s.garagePhone?'Ph: '+s.garagePhone+'\n':'')+(s.garageAddress?s.garageAddress+'\n':'')+'\n';
  t+='Invoice: '+(b.billNo||'-')+'\nDate: '+(b.date||'')+'\nCustomer: '+(b.customer||'-')+(b.vehicle?'\nVehicle: '+b.vehicle+(b.reg?' ('+b.reg+')':''):'')+'\n';
  if(b.category)t+='Service(s): '+b.category+'\n';
  t+='\n';
  if(num(b.serviceCharge))t+='Labour/service: '+money(b.serviceCharge)+'\n';
  billItems(b).forEach(function(i){t+=(i.name||'Item')+' x'+num(i.qty||1)+' = '+money(num(i.qty||1)*num(i.price))+'\n'});
  t+='\nTotal: '+money(b.amount)+'\nReceived: '+money(b.paid)+'\nDue: '+money(b.balance)+'\n\nThank you for choosing '+(s.garageName||'us')+'!';
  return t;
}

function canvasRoundRect(ctx,x,y,w,h,r,fill,stroke){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill()}
  if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}
}
function canvasWrap(ctx,text,x,y,maxWidth,lineHeight,font,color){
  ctx.font=font;ctx.fillStyle=color||'#0b1b36';
  var paragraphs=String(text==null?'':text).split('\n');
  paragraphs.forEach(function(paragraph,pi){
    var words=paragraph.split(/\s+/),line='';
    if(!paragraph){y+=lineHeight;return}
    words.forEach(function(word){
      var test=line?line+' '+word:word;
      if(line&&ctx.measureText(test).width>maxWidth){ctx.fillText(line,x,y);y+=lineHeight;line=word}
      else line=test;
    });
    if(line){ctx.fillText(line,x,y);y+=lineHeight}
    if(pi<paragraphs.length-1)y+=2;
  });
  return y;
}

function canvasToBlob(canvas){
  return new Promise(function(resolve,reject){
    if(canvas.toBlob){canvas.toBlob(function(blob){if(blob)resolve(blob);else reject(new Error('Could not create PNG image'))},'image/png');return}
    try{
      var dataUrl=canvas.toDataURL('image/png'),parts=dataUrl.split(','),raw=atob(parts[1]),bytes=new Uint8Array(raw.length);
      for(var i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
      resolve(new Blob([bytes],{type:'image/png'}));
    }catch(e){reject(e)}
  });
}
function blobToBase64(blob){
  return new Promise(function(resolve,reject){
    var reader=new FileReader();reader.onload=function(){resolve(String(reader.result).split(',')[1]||'')};reader.onerror=function(){reject(new Error('Could not prepare image for sharing'))};reader.readAsDataURL(blob);
  });
}

async function saveInvoiceImageBlob(blob,fileName){
  var base64=await blobToBase64(blob),cap=window.Capacitor;
  /* Native Android/iOS: FileSharer.save writes to the public Downloads collection on Android. */
  if(cap&&cap.isNativePlatform&&cap.isNativePlatform()){
    var fsaver=nativePlugin('FileSharer');
    if(fsaver&&typeof fsaver.save==='function'){
      var result=await fsaver.save({
        filename:fileName,
        contentType:'image/png',
        base64Data:base64,
        android:{saveDirectory:'downloads',relativePath:'CarvoX'}
      });
      return {saved:true,uri:result&&result.uri||null,method:'native-download'};
    }
    /* Legacy fallback: save to app Documents, then offer the Android share/save sheet. */
    var fs=nativePlugin('Filesystem');
    if(fs&&typeof fs.writeFile==='function'){
      var saved=await fs.writeFile({path:'CarvoX/'+fileName,data:base64,directory:'DOCUMENTS',encoding:'base64',recursive:true});
      var sh=nativePlugin('Share');
      if(sh&&typeof sh.share==='function'){
        await sh.share({title:'CarvoX invoice PNG',url:saved.uri,dialogTitle:'Save or share invoice'});
        return {saved:true,uri:saved.uri,method:'documents-share'};
      }
      return {saved:true,uri:saved.uri,method:'app-documents'};
    }
    throw new Error('Native file-saving plugin is missing. Add @capgo/capacitor-file-sharer and run npx cap sync, then rebuild the APK.');
  }
  /* Browser / Chrome: use the File Sharer web implementation when installed, otherwise download anchor. */
  var webSaver=nativePlugin('FileSharer');
  if(webSaver&&typeof webSaver.save==='function'){
    await webSaver.save({filename:fileName,contentType:'image/png',base64Data:base64});
    return {saved:true,method:'browser-plugin'};
  }
  var url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=fileName;a.style.display='none';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){try{URL.revokeObjectURL(url)}catch(e){}},120000);
  return {saved:true,method:'browser-download'};
}

function dataUrlToBlob(dataUrl){
  var parts=String(dataUrl).split(','),mime=(parts[0].match(/data:([^;]+)/)||[])[1]||'image/png';
  var raw=atob(parts[1]||''),bytes=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);
  return new Blob([bytes],{type:mime});
}

function receivedOn(date){
  var pays=data.billPayments,total=0;
  data.bills.filter(function(b){return (b.date||'')===date}).forEach(function(b){
    var later=pays.filter(function(p){return p.billId===b.id}).reduce(function(a,p){return a+num(p.amount)},0);
    total+=Math.max(0,num(b.paid)-later);
  });
  total+=pays.filter(function(p){return (p.date||'')===date}).reduce(function(a,p){return a+num(p.amount)},0);
  return total;
}
function sumExp(list){return list.reduce(function(a,x){return a+num(x.amount)},0)}
function allDue(){return data.bills.reduce(function(a,b){return a+Math.max(0,num(b.balance))},0)}

  var s=byId(data.staff,calStaff),el=$('#calBody');if(!s||!el)return;

  var recs=data.attendance.filter(function(r){return r.staffId===calStaff&&String(r.date||'').indexOf(pre)===0}),by={};
  recs.forEach(function(r){by[r.date]=r.status});
  var first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),t=today();
  var g=['S','M','T','W','T','F','S'].map(function(d){return '<div class="w">'+d+'</div>'}).join('');
  for(var i=0;i<first;i++)g+='<div></div>';
  for(var d=1;d<=days;d++){
    var k=pre+'-'+pad(d),st=by[k]||'',cls=st==='Present'?'p':st==='Absent'?'a':st==='Leave'?'l':st==='Half day'?'h':'';
    g+='<button class="d '+cls+(k===t?' t':'')+'" onclick="CX.dayPick(\''+k+'\')">'+d+'</button>';
  }
  var cnt=function(x){return recs.filter(function(r){return r.status===x}).length};
  el.innerHTML=sheetHead(esc(s.name||'Staff'))+'<div class="row sb"><button class="xbtn" onclick="CX.shiftCal(-1)">'+ic('left',18)+'</button><b>'+calDate.toLocaleDateString('en-IN',{month:'long',year:'numeric'})+'</b><button class="xbtn" onclick="CX.shiftCal(1)">'+ic('right',18)+'</button></div>'+
   '<div class="cal">'+g+'</div><div class="legend"><span><i style="background:#35d6a8"></i>Present</span><span><i style="background:#ff6b82"></i>Absent</span><span><i style="background:#ffb84d"></i>Leave</span><span><i style="background:#5cb3ff"></i>Half day</span></div>'+
   '<div class="grid3" style="margin-top:14px"><div class="card stat"><div class="l">Present</div><div class="n">'+cnt('Present')+'</div></div><div class="card stat"><div class="l">Leave</div><div class="n">'+cnt('Leave')+'</div></div><div class="card stat"><div class="l">Absent</div><div class="n">'+cnt('Absent')+'</div></div></div><div class="note">Tap any date to set or change attendance.</div>';

var repDate=null,pnlMonth=null;
function rd(){if(!repDate)repDate=today();return repDate}
function setRepDate(v){if(v){repDate=v;render()}}
function repToday(){repDate=today();render()}
function repYest(){var d=new Date();d.setDate(d.getDate()-1);repDate=dstr(d);render()}
var PAL=['#2f8cff','#5cc8ff','#7c6cff','#ffb84d','#ff6b8b','#36d6e7','#a3b6d9','#4f6bd6','#35d6a8'];
VIEW.reports=function(){
  var sel=rd(),bills=data.bills.filter(function(b){return (b.date||'')===sel}),exps=data.expenses.filter(function(e){return (e.date||'')===sel});
  var rec=receivedOn(sel),billed=bills.reduce(function(a,b){return a+num(b.amount)},0),ex=sumExp(exps),profit=bills.reduce(function(a,b){return a+num(b.profit)},0),dues=bills.reduce(function(a,b){return a+Math.max(0,num(b.balance))},0);
  var h=head('Reports','<button class="sm" onclick="CX.export()">'+ic('download',16)+'Backup</button>');
  h+='<div class="card"><label style="margin-top:0">View dashboard for date</label><input type="date" value="'+esc(sel)+'" onchange="CX.repDate(this.value)"><div class="row" style="margin-top:10px"><button class="sm" onclick="CX.repToday()">Today</button><button class="sm" onclick="CX.repYest()">Yesterday</button></div></div>';
  h+='<div class="grid" style="margin-top:12px">'+
   '<button class="card stat hot" onclick="CX.chart(\'earnings\')"><div class="l">Earnings</div><div class="n">'+money(rec)+'</div><div class="foot">Tap for chart</div></button>'+
   '<button class="card stat" onclick="CX.chart(\'expenses\')"><div class="l">Expenses</div><div class="n">'+money(ex)+'</div><div class="foot">Tap for chart</div></button>'+
   '<button class="card stat" onclick="CX.chart(\'profit\')"><div class="l">Profit</div><div class="n">'+money(profit)+'</div><div class="foot">Tap for chart</div></button>'+
   '<button class="card stat" onclick="CX.chart(\'bills\')"><div class="l">Bills</div><div class="n">'+bills.length+'</div><div class="foot">Tap for chart</div></button>'+
   '<button class="card stat" style="grid-column:1/-1" onclick="CX.chart(\'dues\')"><div class="l">Pending customer dues (this date)</div><div class="n">'+money(dues)+'</div><div class="foot">Tap for chart</div></button></div>';
  h+='<h3>Billing summary</h3><div class="card"><div class="l" style="color:var(--muted);font-size:.78rem">Total billed on this date</div><div class="n" style="font-size:1.6rem;font-weight:800">'+money(billed)+'</div><div class="bar"><span style="width:'+(rec?Math.min(100,rec/((rec+ex)||1)*100):0)+'%"></span></div><div class="note">Bar shows received vs expenses for the day.</div></div>';
  h+='<h3>Bills on this date</h3>'+(bills.length?'<div class="list">'+bills.map(billCard).join('')+'</div>':empty('No bills on this date.'));
  h+='<h3>Expenses on this date</h3>'+(exps.length?'<div class="list">'+exps.map(expCard).join('')+'</div>':empty('No expenses on this date.'));
  var pm=pnlMonth||today().slice(0,7),y=+pm.slice(0,4),mo=+pm.slice(5,7),dim=new Date(y,mo,0).getDate(),inc=0;
  for(var d=1;d<=dim;d++)inc+=receivedOn(pm+'-'+pad(d));
  var mex=sumExp(data.expenses.filter(function(e){return (e.date||'').indexOf(pm)===0})),mb=data.bills.filter(function(b){return (b.date||'').indexOf(pm)===0});
  var mprofit=mb.reduce(function(a,b){return a+num(b.profit)},0),net=inc-mex;
  h+='<h3>Monthly profit &amp; loss</h3><div class="card"><input type="month" value="'+esc(pm)+'" onchange="CX.pnl(this.value)"><div class="grid4" style="margin-top:12px">'+
   '<div class="stat"><div class="l">Earnings</div><div class="n">'+money(inc)+'</div></div>'+
   '<div class="stat"><div class="l">Profit</div><div class="n">'+money(mprofit)+'</div></div>'+
   '<div class="stat"><div class="l">Expenses</div><div class="n">'+money(mex)+'</div></div>'+
   '<div class="stat"><div class="l">Net</div><div class="n" style="color:'+(net>=0?'var(--ok)':'var(--bad)')+'">'+money(net)+'</div></div>'+
   '</div><div class="note">'+mb.length+' bill'+(mb.length===1?'':'s')+' in this month. Earnings count money actually received. Profit is the sum of profit entered on bills. Net = Earnings − Expenses.</div></div>';
  return h;
};
function chartItems(kind){
  var date=rd(),bs=data.bills.filter(function(x){return (x.date||'')===date}),ex=data.expenses.filter(function(x){return (x.date||'')===date}),map={},pays=data.billPayments;
  var add=function(l,v){v=num(v);if(v<=0)return;l=l||'Unspecified';map[l]=(map[l]||0)+v};
  if(kind==='earnings'){bs.forEach(function(b){var later=pays.filter(function(p){return p.billId===b.id}).reduce(function(a,p){return a+num(p.amount)},0);add(b.paymentMode||'Not specified',Math.max(0,num(b.paid)-later))});pays.filter(function(p){return (p.date||'')===date}).forEach(function(p){add(p.mode||'Not specified',p.amount)})}
  if(kind==='expenses')ex.forEach(function(x){add(x.category||x.title||'Other',x.amount)});
  if(kind==='profit')bs.forEach(function(b){add(b.category||b.billNo||'Bill',b.profit)});
  if(kind==='bills')bs.forEach(function(b){add(b.category||'General service',1)});
  if(kind==='dues')bs.forEach(function(b){add(b.customer||'Customer',Math.max(0,num(b.balance)))});
  return Object.keys(map).map(function(k){return{label:k,value:map[k]}}).sort(function(a,b){return b.value-a.value}).slice(0,9);
}
function pieSvg(items){
  var total=items.reduce(function(a,x){return a+x.value},0);
  if(!total)return '<div class="empty" style="width:100%">No data for this date.</div>';
  var ang=-90,paths='';
  items.forEach(function(it,i){
    var sw=it.value/total*360,a0=ang*Math.PI/180,a1=(ang+sw)*Math.PI/180;
    var x1=150+112*Math.cos(a0),y1=150+112*Math.sin(a0),x2=150+112*Math.cos(a1),y2=150+112*Math.sin(a1);
    var d=sw>=359.99?'M150 38A112 112 0 1 1 149.99 38Z':'M150 150L'+x1+' '+y1+'A112 112 0 '+(sw>180?1:0)+' 1 '+x2+' '+y2+'Z';
    paths+='<path d="'+d+'" fill="'+PAL[i%PAL.length]+'" stroke="rgba(0,0,0,.35)" stroke-width="2"/>';ang+=sw;
  });
  return '<svg viewBox="0 0 300 300" width="260" height="260">'+paths+'<circle cx="150" cy="150" r="50" fill="var(--sheet2)"/><text x="150" y="146" text-anchor="middle" font-size="11" fill="var(--muted)">TOTAL</text><text x="150" y="166" text-anchor="middle" font-size="16" font-weight="800" fill="var(--text)">'+(total>999999?'₹'+(total/100000).toFixed(1)+'L':money(total))+'</text></svg>';
}
function openChart(kind){
  var names={earnings:'Earnings breakdown',expenses:'Expense breakdown',profit:'Profit breakdown',bills:'Bills breakdown',dues:'Pending dues breakdown'};
  var items=chartItems(kind);
  openSheet(sheetHead(names[kind])+'<div class="note" style="margin:0 0 6px">Date: '+esc(rd())+'</div><div class="pie">'+pieSvg(items)+'</div>'+
   (items.length?items.map(function(it,i){return '<div class="lg"><span><i style="background:'+PAL[i%PAL.length]+'"></i>'+esc(it.label)+'</span><b>'+(kind==='bills'?it.value+' bills':money(it.value))+'</b></div>'}).join(''):''));
}

/* settings */
VIEW.settings=function(){
  var s=data.settings,bg=bgState(),th=themeName();
  var seg=function(cur,opts,fn){return '<div class="seg">'+opts.map(function(o){return '<button class="'+(cur===o[0]?'on':'')+'" onclick="'+fn+'(\''+o[0]+'\')">'+o[1]+'</button>'}).join('')+'</div>'};
  var h=head('Settings')+
  '<div class="card"><h3 style="margin-top:0">Garage profile</h3><p class="note" style="margin-top:0">Shown on the home screen and on every invoice.</p>'+
   '<label>Garage name</label><input id="s_name" maxlength="70" value="'+esc(s.garageName||'')+'" placeholder="e.g. My Garage">'+
   '<label>Phone</label><input id="s_phone" type="tel" value="'+esc(s.garagePhone||'')+'">'+
   '<label>Address</label><input id="s_addr" value="'+esc(s.garageAddress||'')+'">'+
   '<label>Garage logo (optional)</label><input id="s_logo" type="file" accept="image/*">'+
   (s.garageLogo?'<div class="row" style="margin-top:10px"><img src="'+esc(s.garageLogo)+'" alt="" style="width:56px;height:56px;object-fit:contain;border-radius:12px;border:1px solid var(--line)"><button class="sm danger" onclick="CX.clearLogo()">Remove logo</button></div>':'')+
   '<button class="primary full" style="margin-top:16px" onclick="CX.saveProfile()">Save profile</button></div>'+
  '<div class="card" style="margin-top:12px"><h3 style="margin-top:0">Appearance</h3><label style="margin-top:0">Theme</label>'+seg(th,[['blue','Electric Blue'],['midnight','Midnight'],['light','Light'],['frosted','Frosted Glass']],'CX.theme')+
   '<label>Text size</label>'+seg(String(num(s.fontScale)||1),[['0.9','Small'],['1','Default'],['1.15','Large'],['1.3','XL']],'CX.font')+'</div>'+
  '<div class="card" style="margin-top:12px"><h3 style="margin-top:0">Background</h3><label style="margin-top:0">Preset</label>'+seg(bg.s,[['cars','Garage cars'],['blue','Blue'],['dark','Black'],['custom','Mine']],'CX.bg')+
   '<label>Image visibility <span id="opv">'+bg.o+'%</span></label><input type="range" min="10" max="100" value="'+bg.o+'" oninput="CX.bgOp(this.value)">'+
   '<label>Upload your own wallpaper</label><input id="s_bg" type="file" accept="image/*" onchange="CX.bgUpload(this)">'+
   '<button class="sm full" style="margin-top:10px" onclick="CX.bgReset()">Reset background</button></div>'+
  '<div class="card" style="margin-top:12px"><h3 style="margin-top:0">Backup &amp; restore</h3><p class="note" style="margin-top:0">Your records live only on this phone. Back up regularly, especially before uninstalling.</p>'+
   '<div class="row wrap" style="margin-top:10px"><button class="primary" style="flex:1" onclick="CX.export()">'+ic('download',18)+'Export file</button><button style="flex:1" onclick="CX.copyBackup()">'+ic('copy',18)+'Copy text</button></div>'+
   '<div class="row wrap" style="margin-top:8px"><button style="flex:1" onclick="document.getElementById(\'impf\').click()">'+ic('upload',18)+'Import file</button><button style="flex:1" onclick="CX.pasteImport()">Paste &amp; restore</button></div><input id="impf" type="file" accept="application/json,.json" hidden onchange="CX.importFile(this)"></div>'+
  '<div class="card" style="margin-top:12px"><h3 style="margin-top:0">App PIN lock</h3><p class="note" style="margin-top:0">'+(s.appPin?'PIN is ON. It is asked each time the app opens.':'Optional. Ask for a PIN each time the app opens.')+'</p><input id="s_pin" type="password" inputmode="numeric" maxlength="8" placeholder="4–8 digit PIN" style="margin-top:8px"><div class="row" style="margin-top:10px"><button class="primary" style="flex:1" onclick="CX.setPin()">'+ic('lock',18)+'Save PIN</button>'+(s.appPin?'<button style="flex:1" onclick="CX.rmPin()">Remove PIN</button>':'')+'</div><div class="note">If you forget the PIN, the only way in is clearing app data, which erases records. Keep a backup.</div></div>'+
  '<div class="card" style="margin-top:12px"><h3 style="margin-top:0">About</h3><p class="note" style="margin-top:0">CarvoX version '+VERSION+'</p><button class="sm" style="margin-top:10px" onclick="CX.about()">'+ic('info',16)+'What’s new</button></div>'+
  '<div class="card" style="margin-top:12px"><h3 style="margin-top:0;color:var(--bad)">Danger zone</h3><button class="danger full" onclick="CX.reset()">'+ic('trash',18)+'Reset all data</button></div>';
  return h;
};
function downscale(file,max,cb){
  var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){
    try{var sc=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',.85))}catch(e){toast('Could not use this image')}};
    im.onerror=function(){toast('Could not read this image')};im.src=r.result};
  r.readAsDataURL(file);
}
function saveProfile(){
  var s=data.settings;
  s.garageName=$('#s_name').value.trim().slice(0,70);s.garagePhone=$('#s_phone').value.trim();s.garageAddress=$('#s_addr').value.trim();
  var f=$('#s_logo').files&&$('#s_logo').files[0];
  if(f){downscale(f,512,function(u){s.garageLogo=u;persist();toast('Profile saved')});return}
  persist();toast('Profile saved');
}
function setPin(){
  var p=$('#s_pin').value;
  if(!/^\d{4,8}$/.test(p)){toast('PIN must be 4 to 8 digits');return}
  data.settings.appPin=p;persist();toast('PIN saved');
}

/* PIN lock + about */
function showLock(){
  var ov=document.createElement('div');ov.id='lock';
  ov.innerHTML='<div class="card" style="width:100%;max-width:340px;text-align:center;padding:24px"><div class="mark" style="margin:0 auto 14px;width:60px;height:60px"><img alt="" src="'+FALLBACK_LOGO+'"></div><h2>CarvoX</h2><p class="note">Enter your PIN</p><input id="lk" type="password" inputmode="numeric" maxlength="8" style="margin-top:12px;text-align:center;font-size:1.2rem;letter-spacing:6px"><button class="primary full" style="margin-top:12px" id="lkOk">Unlock</button><p id="lkE" style="color:var(--bad);font-size:.85rem;margin-top:10px;min-height:1em"></p></div>';
  document.body.appendChild(ov);
  var go2=function(){if($('#lk').value===data.settings.appPin){try{sessionStorage.setItem('cx_ok','1')}catch(e){}ov.remove()}else{$('#lkE').textContent='Incorrect PIN';$('#lk').value=''}};
  $('#lkOk').addEventListener('click',go2);$('#lk').addEventListener('keydown',function(e){if(e.key==='Enter')go2()});
  setTimeout(function(){$('#lk').focus()},50);
}
function about(){
  openSheet(sheetHead('CarvoX '+VERSION)+
    '<h3 style="margin-top:4px">Latest updates</h3><ul style="padding-left:20px;line-height:1.7;color:var(--muted);margin:0">'+
    '<li>Version 4.0: Frosted Glass / Minimal is now the default theme with monochrome Nothing-inspired styling, translucent blur surfaces and floating glass navigation.</li>'+ 
    '<li>Electric Blue, Midnight and Light themes remain available and unchanged.</li>'+ 
    '<li>Monthly Profit &amp; Loss now shows Earnings, Profit, Expenses and Net.</li>'+
    '<li>Invoice Download Image now generates a PNG with native file-save and browser fallback support.</li>'+ 
    '<li>Print invoice now uses the designed invoice artwork with WebView/native print support and a print-ready PNG fallback.</li>'+ 
    '<li>Frosted Glass is selected automatically on the first launch after this update; other themes remain available in Settings.</li>'+ 
    '</ul><h3>App features</h3><ul style="padding-left:20px;line-height:1.7;color:var(--muted);margin:0">'+
    '<li>Dashboard with daily earnings, expenses, profit, bills and pending dues.</li>'+ 
    '<li>Stock management, suppliers and stock purchase records.</li>'+ 
    '<li>Billing with customer and vehicle details, service charges, stock parts, custom items, payments and dues.</li>'+ 
    '<li>Customer profiles and service history.</li>'+ 
    '<li>Staff profiles, attendance calendar, leave tracking and salary payments.</li>'+ 
    '<li>Expense tracking, reports, charts and monthly Profit &amp; Loss.</li>'+ 
    '<li>Data backup, restore, PIN lock, themes, font size and wallpapers.</li>'+ 
    '<li>Your records are stored locally on this device. Export a backup regularly.</li>'+ 
    '</ul>');
}

/* ================= public API ================= */
window.CX={
  go:go,close:closeSheet,search:setSearch,
  add:function(t){openForm(t,null)},edit:function(t,id){openForm(t,id)},editFromSheet:function(t,id){closeSheet();setTimeout(function(){openForm(t,id)},80)},
  del:removeRecord,
  billNew:function(){openBill(null)},viewBill:viewBill,viewBillFrom:function(id){closeSheet();setTimeout(function(){viewBill(id)},80)},editBill:editBill,payBill:payBill,waBill:waBill,downloadBill:downloadBill,printBill:printBill,
  addPart:addPart,addCustom:addCustom,rmPart:function(i){parts.splice(i,1);renderBillLists()},rmCustom:function(i){customs.splice(i,1);renderBillLists()},estProfit:estProfit,
  viewCustomer:viewCustomer,billFor:billFor,
  viewStaff:viewStaff,markToday:markToday,paySalary:paySalary,openCal:openCal,shiftCal:shiftCal,dayPick:dayPick,dayPut:dayPut,
  repDate:setRepDate,repToday:repToday,repYest:repYest,chart:openChart,pnl:function(v){if(v){pnlMonth=v;render()}},
  export:exportBackup,copyBackup:function(){copyText(backupJSON(),'Backup copied')},importFile:importFile,pasteImport:pasteImport,
  saveProfile:saveProfile,clearLogo:function(){delete data.settings.garageLogo;persist()},
  theme:function(v){data.settings.theme=v;persist()},font:function(v){data.settings.fontScale=num(v)||1;persist()},
  bg:function(v){try{localStorage.setItem(BG_STYLE,v)}catch(e){}render()},
  bgOp:function(v){try{localStorage.setItem(BG_OP,String(v))}catch(e){}var e=$('#opv');if(e)e.textContent=v+'%';applyLook()},
  bgUpload:function(inp){var f=inp.files&&inp.files[0];if(!f)return;downscale(f,1600,function(u){try{localStorage.setItem(BG_CUSTOM,u);localStorage.setItem(BG_STYLE,'custom');render();toast('Wallpaper saved')}catch(e){toast('Image too large, try a smaller one')}})},
  bgReset:function(){try{localStorage.removeItem(BG_CUSTOM);localStorage.setItem(BG_STYLE,'cars');localStorage.setItem(BG_OP,'88')}catch(e){}render();toast('Background reset')},
  setPin:setPin,rmPin:function(){ask('Remove the app PIN?','Remove',function(){delete data.settings.appPin;persist();toast('PIN removed')},false)},
  about:about,
  reset:function(){ask('Delete ALL records on this phone? Export a backup first. This cannot be undone.','Delete everything',function(){ask('Last check: really erase everything?','Yes, erase',function(){data=emptyData();save();render();toast('All data cleared')})})}
};

/* ================= boot ================= */
try{
  $('#hInfo').addEventListener('click',about);
  $('#hSet').addEventListener('click',function(){go('settings')});
  render();
  try{if(data.settings.appPin&&!sessionStorage.getItem('cx_ok'))showLock()}catch(e){if(data.settings.appPin)showLock()}
}catch(bootError){
  showErr('CarvoX startup error: '+(bootError&&bootError.message?bootError.message:bootError));
  try{renderNav();renderHeader()}catch(ignore){}
  var pageEl=$('#page');if(pageEl)pageEl.innerHTML='<div class="empty">CarvoX could not start. Your local records are untouched. Please send the red error message to support.</div>';
}
})();
</script>
