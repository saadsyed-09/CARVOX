<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>CARVOX Garage Pro</title>
<style>
:root{--bg:#07111f;--panel:rgba(18,31,49,.72);--panel2:rgba(25,42,63,.88);--line:rgba(255,255,255,.12);--text:#f4f7fb;--muted:#9eafc3;--blue:#398bff;--blue2:#72b5ff;--green:#31d49a;--red:#ff6378;--shadow:0 12px 35px rgba(0,0,0,.28)}
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;background:radial-gradient(ellipse at top,#152943 0,#07111f 52%,#040912 100%);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit;border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:13px;padding:10px 13px}button:active{transform:scale(.985)}button.primary{background:linear-gradient(135deg,#2378ef,#4ba4ff);border:0;color:#fff;font-weight:700}button.danger{color:#ff8796;border-color:rgba(255,99,120,.3)}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:rgba(3,10,19,.55);color:var(--text);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(57,139,255,.16)}label{display:block;color:var(--muted);font-size:12px;margin:10px 0 5px}textarea{min-height:80px;resize:vertical}
#app{max-width:760px;margin:auto;padding-bottom:100px}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(5,12,22,.82);backdrop-filter:blur(24px);border-bottom:1px solid var(--line)}
.logo{width:44px;height:44px;border-radius:13px;object-fit:cover;border:1px solid rgba(255,255,255,.2)}.brand{flex:1;min-width:0}.brand strong{font-size:20px;letter-spacing:.6px}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:2px}
main{padding:16px}.pagehead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:5px 0 16px}.pagehead h1{font-size:24px;margin:0}.sub{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);backdrop-filter:blur(18px)}.metric{font-size:24px;font-weight:800;margin-top:5px}.metriclabel{color:var(--muted);font-size:12px}.hero{background:linear-gradient(135deg,rgba(30,105,218,.26),rgba(255,255,255,.04));border:1px solid rgba(96,169,255,.22);border-radius:22px;padding:18px;margin-bottom:14px}.hero h2{margin:0 0 6px;font-size:22px}.hero p{margin:0;color:var(--muted);font-size:13px}
.sectiontitle{font-weight:750;margin:20px 0 10px}.list{display:grid;gap:10px}.item{display:flex;align-items:center;gap:12px;padding:13px;background:var(--panel);border:1px solid var(--line);border-radius:16px}.itemmain{flex:1;min-width:0}.itemmain strong{display:block;overflow-wrap:anywhere}.itemmain small{display:block;color:var(--muted);margin-top:3px}.amount{font-weight:800;white-space:nowrap}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:rgba(57,139,255,.15);color:#8dc4ff;font-size:11px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(5,12,22,.88);backdrop-filter:blur(24px);border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom));display:flex;justify-content:center}nav .navinner{display:flex;width:100%;max-width:760px;gap:3px}nav button{flex:1;border:0;background:transparent;padding:8px 2px;font-size:10px;color:var(--muted);border-radius:12px}nav button span{display:block;font-size:18px;margin-bottom:2px}nav button.active{background:rgba(57,139,255,.17);color:#9acbff}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}.sheet{width:100%;max-width:760px;max-height:92vh;overflow:auto;background:linear-gradient(180deg,#17283b,#0b1725);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:16px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(0,0,0,.4)}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.sheethead h2{margin:0;font-size:20px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;margin-top:16px}.actions>*{flex:1}.searchrow{display:flex;gap:8px;margin-bottom:12px}.searchrow input{flex:1}.empty{text-align:center;color:var(--muted);padding:30px 10px}.toast{position:fixed;z-index:60;bottom:100px;left:50%;transform:translateX(-50%);background:#2b8aee;color:white;padding:10px 16px;border-radius:99px;box-shadow:var(--shadow)}
@media(max-width:420px){main{padding:12px}.grid{gap:8px}.card{padding:13px}.metric{font-size:21px}.pagehead h1{font-size:21px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div id="app">
<header><img class="logo" src="assets/carvox-logo.png" alt="CARVOX"><div class="brand"><strong>CARVOX</strong><small>GARAGE MANAGEMENT</small></div><button onclick="App.openSettings()" title="Settings">⚙</button></header>
<main id="page"></main>
<nav><div class="navinner" id="nav"></div></nav>
</div>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s), money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2}), today=()=>new Date().toISOString().slice(0,10), uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaults={customers:[],bills:[],expenses:[],stock:[],staff:[],attendance:[],suppliers:[],purchases:[],settings:{garageName:'CARVOX Garage',phone:'',address:'',theme:'blue'}};
let data, page='home', searchTerm='';
try{data=JSON.parse(localStorage.getItem('carvox_v1'))||structuredClone(defaults)}catch(e){data=structuredClone(defaults)}
for(const k in defaults) if(data[k]==null)data[k]=structuredClone(defaults[k]);
const navItems=[['home','⌂','Home'],['bills','▤','Bills'],['customers','♙','Customers'],['stock','▦','Stock'],['more','•••','More']];
function save(){try{localStorage.setItem('carvox_v1',JSON.stringify(data))}catch(e){toast('Storage full. Export a backup.')} }
function toast(t){let el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2100)}
function renderNav(){$('#nav').innerHTML=navItems.map(([p,i,t])=>`<button class="${page===p?'active':''}" onclick="App.go('${p}')"><span>${i}</span>${t}</button>`).join('')}
function header(title,action=''){return `<div class="pagehead"><div><h1>${title}</h1><div class="sub">CARVOX • Garage workspace</div></div>${action}</div>`}
function card(label,val,emoji){return `<div class="card"><div class="metriclabel">${emoji||''} ${label}</div><div class="metric">${val}</div></div>`}
function home(){
 const revenue=data.bills.reduce((s,b)=>s+Number(b.total||0),0),received=data.bills.reduce((s,b)=>s+Number(b.paid||0),0),expenses=data.expenses.reduce((s,e)=>s+Number(e.amount||0),0),due=Math.max(0,revenue-received);
 return `${header('Dashboard',`<button onclick="App.openForm('bill')">＋ Bill</button>`)}
 <div class="hero"><h2>Welcome to CARVOX 👋</h2><p>Manage your garage, jobs, customers, inventory and payments in one place.</p></div>
 <div class="grid">${card('Total bills',data.bills.length,'▤')}${card('Total sales',money(revenue),'₹')}${card('Received',money(received),'✓')}${card('Pending',money(due),'◷')}${card('Expenses',money(expenses),'↘')}${card('Net recorded',money(received-expenses),'∑')}</div>
 <div class="sectiontitle">Quick actions</div><div class="grid"><button class="primary" onclick="App.openForm('bill')">＋ Create bill</button><button onclick="App.openForm('customer')">＋ Add customer</button><button onclick="App.openForm('expense')">＋ Add expense</button><button onclick="App.openForm('stock')">＋ Add stock item</button></div>
 <div class="sectiontitle">Recent bills</div>${renderList('bills',data.bills.slice(0,5))}`;
}
const cfg={
 customers:{title:'Customers',fields:[['name','Customer name','text',1],['phone','Phone / WhatsApp','tel'],['vehicle','Vehicle model','text'],['reg','Vehicle registration','text'],['notes','Notes','textarea']]},
 bills:{title:'Bill / Job card',fields:[['customer','Customer name','text',1],['phone','Phone','tel'],['vehicle','Vehicle','text'],['reg','Registration number','text'],['category','Service category','select',['ALIGNMENT','BALANCING','DENTING','PAINTING','REPAIRS','WASHING','ELECTRICAL WORK','AC WORK','INSURANCE','OTHER']],['description','Work / parts description','textarea'],['total','Total amount (₹)','number',1],['paid','Received amount (₹)','number'],['mode','Payment mode','select',['Cash','UPI','Bank transfer','Card','Cheque','Other']],['date','Date','date']]},
 expenses:{title:'Expense',fields:[['title','Expense name','text',1],['amount','Amount (₹)','number',1],['category','Category','text'],['paidTo','Paid to / vendor','text'],['mode','Payment mode','select',['Cash','UPI','Bank transfer','Card','Cheque','Other']],['date','Date','date'],['notes','Notes','textarea']]},
 stock:{title:'Stock item',fields:[['name','Part name','text',1],['partNo','Part number','text'],['qty','Quantity','number',1],['buy','Purchase price (₹)','number'],['sell','Selling price (₹)','number'],['supplier','Supplier','text']]},
 staff:{title:'Staff member',fields:[['name','Employee name','text',1],['phone','Phone','tel'],['role','Role / designation','text'],['salary','Monthly salary (₹)','number'],['joining','Joining date','date'],['notes','Notes','textarea']]},
 suppliers:{title:'Supplier',fields:[['name','Supplier name','text',1],['phone','Phone','tel'],['parts','Parts / speciality','text'],['address','Address','textarea'],['notes','Notes','textarea']]},
 attendance:{title:'Attendance',fields:[['staff','Employee name','text',1],['date','Date','date'],['status','Status','select',['Present','Absent','Leave','Half day']],['notes','Notes','text']]},
 purchases:{title:'Stock purchase',fields:[['part','Part name','text',1],['qty','Quantity purchased','number',1],['unitCost','Unit cost (₹)','number'],['supplier','Supplier','text'],['date','Date','date'],['paid','Amount paid (₹)','number']]}
};
function openForm(type,id){
 const c=cfg[type];if(!c)return;const arr=data[type],old=id?arr.find(x=>x.id===id)||{}:{};
 let html=`<div class="sheethead"><h2>${id?'Edit':'Add'} ${c.title}</h2><button onclick="App.close()">✕</button></div><form id="recordForm"><div class="formgrid">`;
 c.fields.forEach(([k,label,t,req])=>{let v=old[k]??(k==='date'?today():'');let input=t==='textarea'?`<textarea name="${k}">${esc(v)}</textarea>`:t==='select'?`<select name="${k}">${(req||[]).map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`:`<input name="${k}" type="${t}" value="${esc(v)}" ${req===1?'required':''} ${t==='number'?'step="0.01" min="0"':''}>`;html+=`<div class="${t==='textarea'?'full':''}"><label>${label}</label>${input}</div>`});
 html+=`</div><div class="actions"><button type="button" onclick="App.close()">Cancel</button><button class="primary" type="submit">Save record</button></div></form>`;
 openSheet(html);$('#recordForm').onsubmit=e=>{e.preventDefault();const obj={};c.fields.forEach(([k])=>{let el=e.target.elements[k];obj[k]=el.type==='number'?Number(el.value||0):el.value.trim()});if(type==='bills'){obj.paid=Number(obj.paid||0);obj.total=Number(obj.total||0);obj.balance=Math.max(0,obj.total-obj.paid)}obj.id=id||uid();obj.updatedAt=new Date().toISOString();if(id){let ix=arr.findIndex(x=>x.id===id);if(ix>=0)arr[ix]=Object.assign(arr[ix],obj)}else arr.unshift(obj);save();closeSheet();render();toast('Saved successfully')};
}
function openSheet(html){let o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="sheet">${html}</div>`;o.addEventListener('click',e=>{if(e.target===o)closeSheet()});document.body.appendChild(o);o.querySelector('.sheet').addEventListener('touchmove',e=>e.stopPropagation(),{passive:true});}
function closeSheet(){document.querySelectorAll('.overlay').forEach(x=>x.remove())}
function renderList(type,arr){
 if(!arr.length)return `<div class="empty">No records yet. Tap + to add your first one.</div>`;
 return `<div class="list">${arr.map(x=>{let title=x.name||x.customer||x.title||x.part||x.staff||'Record',desc=x.phone||x.reg||x.category||x.date||x.role||'',amt=x.total!=null?money(x.total):x.amount!=null?money(x.amount):x.qty!=null?`Qty: ${x.qty}`:'';return `<div class="item"><div class="itemmain"><strong>${esc(title)}</strong><small>${esc(desc)} ${x.mode?(' • '+esc(x.mode)):''}</small>${x.balance>0?`<span class="pill">Due ${money(x.balance)}</span>`:''}</div><div class="amount">${amt}</div>${type==='bills'?`<button title="Print bill" onclick="App.printBill('${x.id}')">⎙</button><button title="Download bill image" onclick="App.downloadBill('${x.id}')">⬇</button>`:''}<button onclick="App.edit('${type}','${x.id}')">✎</button></div>`}).join('')}</div>`;
}
function listPage(type,title){let arr=data[type]||[];let filtered=arr.filter(x=>JSON.stringify(x).toLowerCase().includes(searchTerm.toLowerCase()));return `${header(title,`<button class="primary" onclick="App.openForm('${type}')">＋ Add</button>`)}<div class="searchrow"><input placeholder="Search ${title.toLowerCase()}..." value="${esc(searchTerm)}" oninput="App.search(this.value)"><button onclick="App.exportData()">Backup</button></div><div id="recordList">${renderList(type,filtered)}</div>`}
function billsPage(){return `${header('Bills & Job Cards',`<button class="primary" onclick="App.openForm('bills')">＋ New bill</button>`)}<div class="searchrow"><input placeholder="Search bills..." value="${esc(searchTerm)}" oninput="App.search(this.value)"></div><div id="recordList">${renderList('bills',data.bills.filter(x=>JSON.stringify(x).toLowerCase().includes(searchTerm.toLowerCase())))}</div>`}
function more(){return `${header('Garage tools')}<div class="grid"><button onclick="App.go('expenses')">💸 Expenses</button><button onclick="App.go('staff')">👨‍🔧 Staff</button><button onclick="App.go('attendance')">📅 Attendance</button><button onclick="App.go('suppliers')">🏭 Suppliers</button><button onclick="App.go('purchases')">📦 Purchases</button><button onclick="App.go('reports')">📊 Reports</button><button onclick="App.exportData()">⬇ Export backup</button><button onclick="App.importData()">⬆ Import backup</button><button onclick="App.openSettings()">⚙ Settings</button></div>`}
function reports(){let sales=data.bills.reduce((a,b)=>a+Number(b.total||0),0),received=data.bills.reduce((a,b)=>a+Number(b.paid||0),0),exp=data.expenses.reduce((a,b)=>a+Number(b.amount||0),0);return `${header('Reports')}<div class="grid">${card('Sales',money(sales))}${card('Received',money(received))}${card('Outstanding',money(sales-received))}${card('Expenses',money(exp))}${card('Net received',money(received-exp))}${card('Total customers',data.customers.length)}</div><div class="sectiontitle">Data backup</div><button class="primary" onclick="App.exportData()">Export all data (JSON)</button>`}
function render(){renderNav();const views={home,bills: billsPage,customers:()=>listPage('customers','Customers'),stock:()=>listPage('stock','Inventory'),more,expenses:()=>listPage('expenses','Expenses'),staff:()=>listPage('staff','Technicians'),attendance:()=>listPage('attendance','Attendance'),suppliers:()=>listPage('suppliers','Suppliers'),purchases:()=>listPage('purchases','Purchases'),reports};$('#page').innerHTML=(views[page]||home)()}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='CARVOX-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Backup downloaded')}
function importData(){let i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||!Array.isArray(x.bills))throw Error();if(confirm('Replace current app data with this backup?')){data=x;save();render();toast('Backup imported')}}catch(e){toast('Invalid backup file')}};r.readAsText(f)};i.click()}
function settings(){let s=data.settings;openSheet(`<div class="sheethead"><h2>Garage settings</h2><button onclick="App.close()">✕</button></div><label>Garage name</label><input id="setName" value="${esc(s.garageName)}"><label>Phone</label><input id="setPhone" value="${esc(s.phone)}"><label>Address</label><textarea id="setAddress">${esc(s.address)}</textarea><div class="actions"><button onclick="App.close()">Cancel</button><button class="primary" onclick="App.saveSettings()">Save settings</button></div><p class="sub">CARVOX • Data stays on this device unless you export it.</p>`)}

function findBill(id){return data.bills.find(b=>b.id===id)}
function billText(b){return `${data.settings.garageName||'CARVOX GARAGE'}\n${data.settings.phone||''}\n\nINVOICE / JOB CARD\nDate: ${b.date||today()}\nCustomer: ${b.customer||'-'}\nPhone: ${b.phone||'-'}\nVehicle: ${b.vehicle||'-'}\nRegistration: ${b.reg||'-'}\nService: ${b.category||'-'}\n\nWork / Parts:\n${b.description||'-'}\n\nTOTAL: ${money(b.total)}\nRECEIVED: ${money(b.paid)}\nBALANCE: ${money(Math.max(0,Number(b.total||0)-Number(b.paid||0)))}\nPayment: ${b.mode||'-'}\n\nThank you for choosing CARVOX!`}
function printBill(id){const b=findBill(id);if(!b)return;const w=window.open('','_blank');if(!w){toast('Allow pop-ups to print bill');return}w.document.write(`<html><head><title>CARVOX Bill</title><style>body{font:16px Arial;padding:24px;color:#111}h1{letter-spacing:3px}pre{font:16px/1.6 Arial;white-space:pre-wrap}</style></head><body><h1>CARVOX</h1><pre>${esc(billText(b))}</pre><script>window.onload=()=>window.print()<\\/script></body></html>`);w.document.close()}
function downloadBill(id){const b=findBill(id);if(!b)return;const lines=billText(b).split('\\n');const canvas=document.createElement('canvas');canvas.width=900;canvas.height=Math.max(600,lines.length*38+100);const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#101b2b';ctx.font='bold 34px Arial';ctx.fillText('CARVOX',40,55);ctx.font='20px Arial';lines.forEach((line,i)=>ctx.fillText(line,40,100+i*34));canvas.toBlob(blob=>{if(!blob){toast('Could not create image');return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='CARVOX-Bill-'+(b.date||today())+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Bill image downloaded')},'image/png')}

window.App={go(p){page=p;searchTerm='';render()},openForm,edit(type,id){openForm(type,id)},search(v){searchTerm=v;const box=$('#recordList');if(!box)return;const type=page==='bills'?'bills':page;const arr=(data[type]||[]).filter(x=>JSON.stringify(x).toLowerCase().includes(searchTerm.toLowerCase()));box.innerHTML=renderList(type,arr)},close:closeSheet,exportData,importData,openSettings:settings,printBill,downloadBill,saveSettings(){data.settings.garageName=$('#setName').value.trim()||'CARVOX Garage';data.settings.phone=$('#setPhone').value.trim();data.settings.address=$('#setAddress').value.trim();save();closeSheet();render();toast('Settings saved')}};
render();
})();
</script>
</body>
</html>
