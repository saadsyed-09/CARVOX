name: CARVOX APK
run-name: CARVOX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: Build CARVOX Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Setup Java
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 4. Install dependencies
      - name: Install project dependencies
        run: npm install

      # 5. Verify CARVOX logo
      - name: Prepare CARVOX logo
        run: |
          echo "Checking CARVOX launcher icon..."

          if [ -f "assets/icon.png" ]; then
            echo "SUCCESS: assets/icon.png exists"
            file assets/icon.png
          else
            echo "ERROR: assets/icon.png is missing"
            ls -la assets
            exit 1
          fi

      # 6. Build web assets
      - name: Build CARVOX web assets
        run: npm run build

      # 7. Add Android platform if missing
      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      # 8. Generate launcher icons
      - name: Generate Android launcher assets
        run: |
          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#061326' \
            --splashBackgroundColor '#061326'

      # 9. Sync Capacitor
      - name: Sync Capacitor plugins
        run: npx cap sync android

      # 10. Build APK
      - name: Build CARVOX APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 11. Upload APK
      - name: Upload CARVOX APK
        uses: actions/upload-artifact@v4
        with:
          name: CARVOX-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
